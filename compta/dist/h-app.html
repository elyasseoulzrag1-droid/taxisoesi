</head>
<body>
<title>Compta StarringYou</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="color-scheme" content="light dark">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/*
  Compta StarringYou : jetons de design (couleurs, typo, espacements).
  Toute couleur de l'appli vient d'ici. Les règles des composants n'utilisent que var(--...).

  Idée directrice : la compta d'un petit studio de films, lue comme un box-office.
    Encre   : bleu nuit presque noir, pour le texte.
    Papier  : gris très clair, légèrement bleuté (salle éclairée) ; en sombre : salle obscure.
    Nuit    : indigo profond, l'accent (boutons, liens, onglet actif).
    Billet  : le carton des tuiles de chiffres, avec son talon teinté.
  Les couleurs de sens sont séparées de l'accent :
    entrée d'argent (vert sarcelle), sortie d'argent (vermillon), à vérifier (ambre), info (bleu acier).
  Le couple sarcelle / vermillon reste lisible pour les daltoniens (vérifié avec le validateur de palette).

  Le thème sombre est écrit deux fois (préférence du système, puis choix explicite data-theme="dark") :
  les deux blocs doivent rester identiques (un test unitaire le vérifie).
*/

:root {
  color-scheme: light;

  /* Typographie : deux rôles. Figtree pour le texte et les chiffres, Barlow Condensed pour les titres et les talons de billet. */
  --font-ui: "Figtree", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-display: "Barlow Condensed", "Roboto Condensed", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;

  --fs-2xs: 0.6875rem;
  --fs-xs: 0.75rem;
  --fs-sm: 0.875rem;
  --fs-md: 1rem;
  --fs-lg: 1.125rem;
  --fs-xl: 1.375rem;
  --fs-2xl: 1.75rem;
  --fs-3xl: 2.25rem;

  --lh-tight: 1.15;
  --lh-snug: 1.3;
  --lh-body: 1.5;

  /* Espacements : base 4 px. */
  --sp-1: 4px;
  --sp-2: 8px;
  --sp-3: 12px;
  --sp-4: 16px;
  --sp-5: 20px;
  --sp-6: 24px;
  --sp-8: 32px;
  --sp-10: 40px;
  --sp-12: 48px;

  /* Marges latérales : jamais sous 16 px, et on respecte les encoches. */
  --gutter-l: max(16px, env(safe-area-inset-left, 0px));
  --gutter-r: max(16px, env(safe-area-inset-right, 0px));
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);

  /* Rayons. */
  --r-xs: 4px;
  --r-sm: 8px;
  --r-md: 12px;
  --r-lg: 16px;
  --r-xl: 22px;
  --r-full: 999px;

  /* Tailles. Sur téléphone, toute cible tactile fait au moins 44 px. */
  --control-h: 44px;
  --control-h-sm: 36px;
  --topbar-h: 56px;
  --tabbar-h: 60px;
  --sidebar-w: 248px;
  --content-max: 1080px;

  /* Mouvement. */
  --ease: cubic-bezier(0.2, 0.7, 0.2, 1);
  --dur-1: 120ms;
  --dur-2: 220ms;

  /* Plans. */
  --z-sticky: 10;
  --z-nav: 20;
  --z-modal: 50;
  --z-pop: 55;
  --z-toast: 60;

  /* Neutres (teinte 275, bleu nuit). */
  --paper: #eef0f6;
  --surface: #fcfdfe;
  --surface-2: #f4f5fa;
  --sunken: #e7e9f0;
  --line: #dddfe8;
  --line-strong: #babdcb;
  --control-line: #8a8fa3;
  --ink: #16192b;
  --ink-2: #42465b;
  --ink-3: #64687b;

  /* Accent "Nuit". */
  --accent: #3b39a6;
  --accent-hover: #2e298e;
  --accent-soft: #e6eaff;
  --accent-text: #3b39a6;
  --on-accent: #ffffff;

  /* Sens : texte lisible (--x), fond teinté (--x-soft), aplat pour marques et pastilles (--x-fill). */
  --in: #006c52;
  --in-soft: #d9f7eb;
  --in-fill: #11957c;
  --out: #b32707;
  --out-soft: #ffe8e2;
  --out-fill: #da4620;
  --warn: #815200;
  --warn-soft: #fdefcb;
  --warn-fill: #ecaa0b;
  --info: #1c5e95;
  --info-soft: #e2f0ff;
  --info-fill: #2a78d6;

  /* Action destructrice. */
  --danger: #b32707;
  --danger-hover: #962005;
  --on-danger: #ffffff;

  /* Billet (tuile de chiffre). */
  --ticket: #fcfdfe;
  --ticket-stub: #eceef8;
  --ticket-edge: #cfd2e0;
  --ticket-shadow: rgb(22 25 43 / 0.1);

  /* Surface des éléments flottants (menu, infobulle de graphique). */
  --pop: #ffffff;

  /* Notification : fond sombre dans les deux thèmes, avec ses propres couleurs de sens. */
  --toast-bg: #1d2036;
  --toast-ink: #f4f5fa;
  --toast-line: #1d2036;
  --toast-in: #61d7b2;
  --toast-out: #ff8b6d;
  --toast-warn: #f1c45e;
  --toast-info: #87c6f2;
  --toast-accent: #acb7ff;

  --focus: #3b39a6;
  --scrim: rgb(22 25 43 / 0.46);
  --shadow-1: 0 1px 2px rgb(22 25 43 / 0.06);
  --shadow-2: 0 1px 2px rgb(22 25 43 / 0.06), 0 6px 16px rgb(22 25 43 / 0.07);
  --shadow-3: 0 2px 6px rgb(22 25 43 / 0.08), 0 18px 44px rgb(22 25 43 / 0.18);

  /* Encre posée sur un aplat de couleur (étiquette dans une barre, initiales d'un avatar). */
  --on-fill: #ffffff;
  --on-fill-dark: #0b0b0b;

  /* Opaque pour les masques CSS (découpe des billets) : ce n'est pas une couleur visible. */
  --mask-solid: #000000;

  /*
    Palette de séries (graphiques, pastilles d'associés, plateformes pub).
    Ordre fixe, jamais recyclé : au-delà de 8, on regroupe dans "Autres" (--chart-muted).
    Validée pour le thème clair sur --surface (bandes de clarté, chroma, daltonisme, contraste).
  */
  --chart-1: #2a78d6;
  --chart-2: #eb6834;
  --chart-3: #1baf7a;
  --chart-4: #eda100;
  --chart-5: #e87ba4;
  --chart-6: #008300;
  --chart-7: #6250d6;
  --chart-8: #e34948;
  --chart-1-ink: #ffffff;
  --chart-2-ink: #ffffff;
  --chart-3-ink: #ffffff;
  --chart-4-ink: #0b0b0b;
  --chart-5-ink: #ffffff;
  --chart-6-ink: #ffffff;
  --chart-7-ink: #ffffff;
  --chart-8-ink: #ffffff;
  --chart-in: #11957c;
  --chart-out: #da4620;
  --chart-accent: #3b39a6;
  --chart-muted: #8a8fa3;
  --chart-grid: #e3e5ed;
  --chart-axis: #babdcb;
  --chart-hover: rgb(22 25 43 / 0.05);
}

    --in-soft: #103328;
    --in-fill: #2da58b;
    --out: #ff8b6d;
    --out-soft: #441f17;
    --out-fill: #eb5833;
    --warn: #f1c45e;
    --warn-soft: #3b2b0d;
    --warn-fill: #edb333;
    --info: #87c6f2;
    --info-soft: #183046;
    --info-fill: #3987e5;

    --danger: #eb5833;
    --danger-hover: #ff8b6d;
    --on-danger: #0d0f23;

    --ticket: #1f2230;
    --ticket-stub: #272a40;
    --ticket-edge: #3a3e54;
    --ticket-shadow: rgb(0 0 0 / 0.5);

    --pop: #262938;

    --toast-bg: #2c3044;
    --toast-ink: #eaecf5;
    --toast-line: #484c5f;

    --focus: #acb7ff;
    --scrim: rgb(4 5 10 / 0.66);
    --shadow-1: 0 1px 2px rgb(0 0 0 / 0.4);
    --shadow-2: 0 1px 2px rgb(0 0 0 / 0.4), 0 8px 20px rgb(0 0 0 / 0.35);
    --shadow-3: 0 2px 6px rgb(0 0 0 / 0.45), 0 20px 48px rgb(0 0 0 / 0.55);

    --on-fill: #ffffff;
    --on-fill-dark: #0b0b0b;

    --chart-1: #3987e5;
    --chart-2: #d95926;
    --chart-3: #199e70;
    --chart-4: #c98500;
    --chart-5: #d55181;
    --chart-6: #0ca30c;
    --chart-7: #9085e9;
    --chart-8: #e66767;
    --chart-1-ink: #ffffff;
    --chart-2-ink: #ffffff;
    --chart-3-ink: #ffffff;
    --chart-4-ink: #ffffff;
    --chart-5-ink: #ffffff;
    --chart-6-ink: #ffffff;
    --chart-7-ink: #ffffff;
    --chart-8-ink: #ffffff;
    --chart-in: #2da58b;
    --chart-out: #eb5833;
    --chart-accent: #8f9bfb;
    --chart-muted: #6c7187;
    --chart-grid: #2a2d3c;
    --chart-axis: #484c5f;
    --chart-hover: rgb(234 236 245 / 0.07);
  }
}

/*
  Base : remise à zéro, typographie, focus, mise en page de l'appli (barre du haut, onglets du bas,
  colonne latérale) et quelques utilitaires. Aucune couleur en dur : uniquement les jetons de tokens.css.
*/

*,
*::before,
*::after {
  box-sizing: border-box;
}

html {
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent;
}

body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font-ui);
  font-size: var(--fs-md);
  line-height: var(--lh-body);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  text-rendering: optimizeLegibility;
}

h1,
h2,
h3,
h4,
p,
ul,
ol,
dl,
dd,
figure {
  margin: 0;
}

ul,
ol {
  padding: 0;
  list-style: none;
}

h1,
h2,
h3,
h4 {
  font-size: inherit;
  font-weight: 600;
  line-height: var(--lh-snug);
}

a {
  color: var(--accent-text);
  text-decoration-thickness: 1px;
  text-underline-offset: 3px;
}

button,
input,
select,
textarea {
  font: inherit;
  color: inherit;
  margin: 0;
}

button {
  cursor: pointer;
}

button:disabled {
  cursor: not-allowed;
}

img,
svg {
  display: block;
  max-width: 100%;
}

table {
  border-collapse: collapse;
  border-spacing: 0;
}

::selection {
  background: var(--accent-soft);
  color: var(--ink);
}

/* Focus : toujours visible au clavier, jamais au simple clic. */
:focus {
  outline: none;
}

:focus-visible {
  outline: 2px solid var(--focus);
  outline-offset: 2px;
  border-radius: var(--r-xs);
}

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
    scroll-behavior: auto !important;
  }
}

/* ---------- Typographie ---------- */

.page-title,
.h1 {
  font-family: var(--font-display);
  font-size: var(--fs-2xl);
  font-weight: 600;
  line-height: var(--lh-tight);
  letter-spacing: 0.005em;
}

.h2 {
  font-family: var(--font-display);
  font-size: var(--fs-xl);
  font-weight: 600;
  line-height: var(--lh-tight);
  letter-spacing: 0.01em;
}

.h3 {
  font-size: var(--fs-md);
  font-weight: 600;
  line-height: var(--lh-snug);
}

/* Petite étiquette en capitales, comme sur un billet. */
.overline {
  font-family: var(--font-display);
  font-size: 0.8125rem;
  font-weight: 600;
  line-height: 1.2;
  letter-spacing: 0.09em;
  text-transform: uppercase;
  color: var(--ink-3);
}

.text-lg {
  font-size: var(--fs-lg);
}

.text-sm {
  font-size: var(--fs-sm);
}

.text-xs {
  font-size: var(--fs-xs);
}

.strong {
  font-weight: 600;
}

.muted {
  color: var(--ink-2);
}

.subtle {
  color: var(--ink-3);
}

.t-in {
  color: var(--in);
}

.t-out {
  color: var(--out);
}

.t-warn {
  color: var(--warn);
}

.t-info {
  color: var(--info);
}

.t-accent {
  color: var(--accent-text);
}

/* Chiffres alignés en colonne (tableaux, listes de montants). */
.num {
  font-variant-numeric: tabular-nums;
  font-feature-settings: "tnum" 1;
  white-space: nowrap;
}

.nowrap {
  white-space: nowrap;
}

.truncate {
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.break {
  overflow-wrap: anywhere;
}

.link {
  background: none;
  border: 0;
  padding: 0;
  color: var(--accent-text);
  font-weight: 500;
  text-decoration: underline;
  text-decoration-thickness: 1px;
  text-underline-offset: 3px;
  cursor: pointer;
}

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  margin: -1px;
  padding: 0;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  clip-path: inset(50%);
  white-space: nowrap;
  border: 0;
}

/* ---------- Utilitaires de mise en page ---------- */

.stack {
  display: flex;
  flex-direction: column;
  gap: var(--sp-4);
  min-width: 0;
}

.stack-xs {
  gap: var(--sp-1);
}

.stack-sm {
  gap: var(--sp-2);
}

.stack-lg {
  gap: var(--sp-6);
}

.row {
  display: flex;
  align-items: center;
  gap: var(--sp-2);
  min-width: 0;
}

.row-wrap {
  flex-wrap: wrap;
}

.row-between {
  justify-content: space-between;
}

.row-end {
  justify-content: flex-end;
}

.row-top {
  align-items: flex-start;
}

.row-baseline {
  align-items: baseline;
}

.gap-1 {
  gap: var(--sp-1);
}

.gap-3 {
  gap: var(--sp-3);
}

.gap-4 {
  gap: var(--sp-4);
}

.grow {
  flex: 1 1 0;
  min-width: 0;
}

.no-shrink {
  flex-shrink: 0;
}

.grid-2,
.grid-3,
.grid-kpi,
.grid-auto {
  display: grid;
  gap: var(--sp-3);
  min-width: 0;
}

.grid-2,
.grid-3 {
  grid-template-columns: minmax(0, 1fr);
}

/* Tuiles de chiffres : 2 par ligne sur téléphone, 4 sur grand écran. */
.grid-kpi {
  grid-template-columns: repeat(2, minmax(0, 1fr));
}

.grid-auto {
  grid-template-columns: repeat(auto-fit, minmax(min(100%, 260px), 1fr));
}

@media (min-width: 640px) {
  .grid-2 {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .grid-3 {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .grid-2,
  .grid-3,
  .grid-kpi,
  .grid-auto {
    gap: var(--sp-4);
  }
}

@media (min-width: 1000px) {
  .grid-3 {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }

  .grid-kpi {
    grid-template-columns: repeat(4, minmax(0, 1fr));
  }
}

.divider {
  height: 1px;
  border: 0;
  margin: 0;
  background: var(--line);
}

/* Conteneur à défilement horizontal propre (tableaux larges) : la page, elle, ne défile jamais de côté. */
.scroll-x {
  max-width: 100%;
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  overscroll-behavior-x: contain;
}

.hide-phone {
  display: none;
}

@media (min-width: 900px) {
  .hide-phone {
    display: revert;
  }

  .only-phone {
    display: none !important;
  }
}

/* ---------- Coquille de l'appli ---------- */

.app {
  display: flex;
  flex-direction: column;
  min-height: 100vh;
  min-height: 100dvh;
}

.app-topbar {
  position: sticky;
  top: 0;
  z-index: var(--z-nav);
  padding-top: var(--safe-top);
  background: var(--paper);
  border-bottom: 1px solid var(--line);
}

@supports (backdrop-filter: blur(8px)) or (-webkit-backdrop-filter: blur(8px)) {
  .app-topbar {
    background: color-mix(in srgb, var(--paper) 86%, transparent);
    -webkit-backdrop-filter: saturate(1.4) blur(12px);
    backdrop-filter: saturate(1.4) blur(12px);
  }
}

.app-topbar-inner {
  display: flex;
  align-items: center;
  gap: var(--sp-2);
  /* Hauteur fixe : la colonne latérale se cale dessus sur grand écran. */
  height: var(--topbar-h);
  padding: 0 var(--gutter-r) 0 var(--gutter-l);
}

.app-brand {
  display: flex;
  align-items: center;
  gap: var(--sp-2);
  min-width: 0;
  font-family: var(--font-display);
  font-size: var(--fs-xl);
  font-weight: 600;
  line-height: 1;
  letter-spacing: 0.01em;
  color: var(--ink);
  text-decoration: none;
}

/* Le monogramme : un petit billet découpé, en CSS. */
.app-brand-mark {
  flex-shrink: 0;
  display: grid;
  place-items: center;
  width: 30px;
  height: 30px;
  border-radius: var(--r-sm);
  background: var(--accent);
  color: var(--on-accent);
}

.app-brand-name {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.app-topbar-tools {
  display: flex;
  align-items: center;
  gap: var(--sp-2);
  margin-left: auto;
  flex-shrink: 0;
}

/* Bandeau d'état (lecture seule, mode local, données d'exemple...) : en haut de .app-main, il défile avec la page. */
.app-status {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: var(--sp-2);
  width: 100%;
  max-width: var(--content-max);
  margin: 0 auto;
  padding: var(--sp-3) var(--gutter-r) 0 var(--gutter-l);
}

.app-status + .page {
  padding-top: var(--sp-3);
}

.app-body {
  flex: 1 1 auto;
  min-width: 0;
}

.app-sidebar {
  display: none;
}

.app-main {
  min-width: 0;
  padding-bottom: calc(var(--tabbar-h) + var(--safe-bottom) + var(--sp-6));
}

.page {
  display: flex;
  flex-direction: column;
  gap: var(--sp-5);
  width: 100%;
  max-width: var(--content-max);
  margin: 0 auto;
  padding: var(--sp-4) var(--gutter-r) var(--sp-4) var(--gutter-l);
}

.page-narrow {
  max-width: 720px;
}

.page-head {
  display: flex;
  flex-wrap: wrap;
  align-items: flex-end;
  justify-content: space-between;
  gap: var(--sp-2) var(--sp-3);
}

.page-head-text {
  min-width: 0;
}

.page-sub {
  margin-top: 2px;
  color: var(--ink-2);
  font-size: var(--fs-sm);
}

.page-actions {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: var(--sp-2);
}

/* Barre d'onglets du bas (téléphone) : 5 cases, le "+" au centre. */
.app-tabbar {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: var(--z-nav);
  display: grid;
  grid-template-columns: repeat(5, minmax(0, 1fr));
  align-items: stretch;
  height: calc(var(--tabbar-h) + var(--safe-bottom));
  padding: 0 max(4px, env(safe-area-inset-right, 0px)) var(--safe-bottom) max(4px, env(safe-area-inset-left, 0px));
  background: var(--surface);
  border-top: 1px solid var(--line);
}

.app-tab {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 3px;
  min-width: 0;
  min-height: 44px;
  padding: 0 2px;
  border: 0;
  background: none;
  color: var(--ink-3);
  font-family: var(--font-display);
  font-size: 0.8125rem;
  font-weight: 600;
  line-height: 1;
  letter-spacing: 0.04em;
  text-decoration: none;
  cursor: pointer;
}

.app-tab-label {
  max-width: 100%;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.app-tab[aria-current="page"] {
  color: var(--accent-text);
}

.app-tab[aria-current="page"]::before {
  content: "";
  position: absolute;
  top: -1px;
  left: 50%;
  width: 28px;
  height: 3px;
  margin-left: -14px;
  border-radius: 0 0 3px 3px;
  background: var(--accent);
}

.app-tab:focus-visible {
  outline-offset: -3px;
  border-radius: var(--r-sm);
}

.app-tab-add {
  display: grid;
  place-items: center;
  border: 0;
  background: none;
  padding: 0;
  cursor: pointer;
}

.app-tab-add-disc {
  display: grid;
  place-items: center;
  width: 48px;
  height: 48px;
  border-radius: var(--r-full);
  background: var(--accent);
  color: var(--on-accent);
  box-shadow: var(--shadow-2);
  transition: transform var(--dur-1) var(--ease), background-color var(--dur-1) var(--ease);
}

.app-tab-add:active .app-tab-add-disc {
  transform: scale(0.94);
}

.app-tab-add:focus-visible {
  outline: none;
}

.app-tab-add:focus-visible .app-tab-add-disc {
  outline: 2px solid var(--focus);
  outline-offset: 2px;
}

.app-nav-label {
  padding: var(--sp-4) var(--sp-3) var(--sp-1);
}

.app-nav-item {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  min-height: 40px;
  padding: 0 var(--sp-3);
  border: 0;
  border-radius: var(--r-sm);
  background: none;
  color: var(--ink-2);
  font-size: 0.9375rem;
  font-weight: 500;
  text-align: left;
  text-decoration: none;
  cursor: pointer;
  transition: background-color var(--dur-1) var(--ease), color var(--dur-1) var(--ease);
}

.app-nav-item:hover {
  background: var(--sunken);
  color: var(--ink);
}

.app-nav-item[aria-current="page"] {
  background: var(--accent-soft);
  color: var(--accent-text);
  font-weight: 600;
}

.app-nav-count {
  margin-left: auto;
}

.app-sidebar-foot {
  margin-top: auto;
  padding: var(--sp-3);
  color: var(--ink-3);
  font-size: var(--fs-xs);
}

@media (min-width: 900px) {
  .app-body {
    display: grid;
    grid-template-columns: var(--sidebar-w) minmax(0, 1fr);
    align-items: start;
  }

  .app-sidebar {
    position: sticky;
    top: calc(var(--topbar-h) + var(--safe-top) + 1px);
    display: flex;
    flex-direction: column;
    gap: 2px;
    height: calc(100vh - var(--topbar-h) - var(--safe-top) - 1px);
    height: calc(100dvh - var(--topbar-h) - var(--safe-top) - 1px);
    padding: var(--sp-4) var(--sp-3) var(--sp-3) max(12px, env(safe-area-inset-left, 0px));
    overflow-y: auto;
    border-right: 1px solid var(--line);
  }

  .app-tabbar {
    display: none;
  }

  .app-main {
    padding-bottom: var(--sp-10);
  }

  .page {
    gap: var(--sp-6);
    padding: var(--sp-6) max(28px, env(safe-area-inset-right, 0px)) var(--sp-6) 28px;
  }

  .app-status {
    padding: var(--sp-4) max(28px, env(safe-area-inset-right, 0px)) 0 28px;
  }

  .app-status + .page {
    padding-top: var(--sp-4);
  }

  .page-title,
  .h1 {
    font-size: var(--fs-3xl);
  }
}

/* ---------- État de démarrage (avant que le script ne tourne) ---------- */

.boot {
  min-height: 100vh;
  min-height: 100dvh;
  margin: 0;
  color: var(--ink-2);
}

.boot-bar {
  display: flex;
  align-items: center;
  gap: var(--sp-2);
  min-height: calc(var(--topbar-h) + var(--safe-top));
  padding: var(--safe-top) var(--gutter-r) 0 var(--gutter-l);
  border-bottom: 1px solid var(--line);
  color: var(--ink);
  font-family: var(--font-display);
  font-size: var(--fs-xl);
  font-weight: 600;
  letter-spacing: 0.01em;
}

.boot-mark {
  width: 30px;
  height: 30px;
  border-radius: var(--r-sm);
  background: var(--accent);
  -webkit-mask: radial-gradient(circle 5px at 0 50%, transparent 97%, var(--mask-solid)) left / 51% 100% no-repeat,
    radial-gradient(circle 5px at 100% 50%, transparent 97%, var(--mask-solid)) right / 51% 100% no-repeat;
  mask: radial-gradient(circle 5px at 0 50%, transparent 97%, var(--mask-solid)) left / 51% 100% no-repeat,
    radial-gradient(circle 5px at 100% 50%, transparent 97%, var(--mask-solid)) right / 51% 100% no-repeat;
}

.boot-body {
  display: flex;
  flex-direction: column;
  gap: var(--sp-4);
  max-width: var(--content-max);
  margin: 0 auto;
  padding: var(--sp-5) var(--gutter-r) var(--sp-6) var(--gutter-l);
}

.boot-text {
  font-size: var(--fs-sm);
}

.boot-tickets {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: var(--sp-3);
}

.boot-ticket {
  display: block;
  height: 92px;
  border-radius: var(--r-md);
  background: linear-gradient(90deg, var(--ticket-stub) 0 30px, var(--ticket) 30px);
  -webkit-mask: radial-gradient(circle 7px at 30px 0, transparent 97%, var(--mask-solid)) top / 100% 51% no-repeat,
    radial-gradient(circle 7px at 30px 100%, transparent 97%, var(--mask-solid)) bottom / 100% 51% no-repeat;
  mask: radial-gradient(circle 7px at 30px 0, transparent 97%, var(--mask-solid)) top / 100% 51% no-repeat,
    radial-gradient(circle 7px at 30px 100%, transparent 97%, var(--mask-solid)) bottom / 100% 51% no-repeat;
  animation: boot-pulse 1.4s ease-in-out infinite alternate;
}

.boot-ticket:nth-child(2n) {
  animation-delay: 0.2s;
}

.boot-lines {
  display: flex;
  flex-direction: column;
  gap: var(--sp-3);
  padding: var(--sp-4);
  border-radius: var(--r-lg);
  background: var(--surface);
}

.boot-lines span {
  display: block;
  height: 14px;
  border-radius: var(--r-xs);
  background: var(--sunken);
  animation: boot-pulse 1.4s ease-in-out infinite alternate;
}

.boot-lines span:nth-child(2) {
  width: 82%;
}

.boot-lines span:nth-child(3) {
  width: 64%;
}

@keyframes boot-pulse {
  from {
    opacity: 1;
  }

  to {
    opacity: 0.55;
  }
}

@media (min-width: 900px) {
  .boot-tickets {
    grid-template-columns: repeat(4, minmax(0, 1fr));
  }
}

/*
  Styles des composants du kit (src/ui). Aucune couleur en dur : uniquement les jetons de tokens.css.
  Noms de classes réservés au kit : voir la référence api/kit.md. Les vues préfixent leurs propres classes.
*/

@media (min-width: 900px) and (pointer: fine) {
  :root {
    /* À la souris, les contrôles peuvent être un peu plus compacts. */
    --control-h: 40px;
    --control-h-sm: 32px;
  }
}

.icon {
  flex-shrink: 0;
}

/* ---------- Indicateur d'attente ---------- */

.spinner {
  display: inline-block;
  flex-shrink: 0;
  border: 2px solid currentColor;
  border-right-color: transparent;
  border-radius: var(--r-full);
  opacity: 0.85;
  animation: spin 0.7s linear infinite;
}

@keyframes spin {
  to {
    transform: rotate(360deg);
  }
}

@media (prefers-reduced-motion: reduce) {
  .spinner {
    border-right-color: currentColor;
    border-style: dotted;
  }
}

/* ---------- Boutons ---------- */

.btn,
.icon-btn {
  position: relative;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--sp-2);
  min-height: var(--control-h);
  border: 1px solid transparent;
  border-radius: var(--r-md);
  background: none;
  color: var(--ink);
  font-size: 0.9375rem;
  font-weight: 600;
  line-height: 1.2;
  text-decoration: none;
  white-space: nowrap;
  user-select: none;
  transition: background-color var(--dur-1) var(--ease), border-color var(--dur-1) var(--ease), color var(--dur-1) var(--ease),
    transform var(--dur-1) var(--ease);
}

.btn {
  padding: 0 var(--sp-4);
  max-width: 100%;
}

.btn-label {
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
}

.btn:active:not(:disabled),
.icon-btn:active:not(:disabled) {
  transform: scale(0.98);
}

.btn:disabled,
.icon-btn:disabled {
  opacity: 0.5;
}

.btn.is-loading:disabled {
  opacity: 0.8;
  cursor: progress;
}

.btn-full {
  display: flex;
  width: 100%;
}

.btn-sm {
  min-height: var(--control-h-sm);
  padding: 0 var(--sp-3);
  border-radius: var(--r-sm);
  font-size: var(--fs-sm);
}

/* Un petit bouton garde une zone tactile de 44 px de haut. */
.btn-sm::after,
.icon-btn-sm::after,
.search-clear::after,
.segmented-item::after,
.chip-main::after,
.chip-remove::after {
  content: "";
  position: absolute;
  left: 0;
  right: 0;
  top: 50%;
  height: 44px;
  transform: translateY(-50%);
}

.btn-primary {
  background: var(--accent);
  color: var(--on-accent);
}

.btn-primary:hover:not(:disabled) {
  background: var(--accent-hover);
}

.btn-secondary {
  background: var(--surface);
  border-color: var(--line-strong);
  color: var(--ink);
}

.btn-secondary:hover:not(:disabled) {
  background: var(--surface-2);
  border-color: var(--control-line);
}

.btn-ghost {
  color: var(--accent-text);
}

.btn-ghost:hover:not(:disabled) {
  background: var(--accent-soft);
}

.btn-danger {
  background: var(--danger);
  color: var(--on-danger);
}

.btn-danger:hover:not(:disabled) {
  background: var(--danger-hover);
}

.icon-btn {
  flex-shrink: 0;
  width: var(--control-h);
  min-width: var(--control-h);
  padding: 0;
  border-radius: var(--r-full);
}

.icon-btn.btn-ghost {
  color: var(--ink-2);
}

.icon-btn.btn-ghost:hover:not(:disabled) {
  background: var(--sunken);
  color: var(--ink);
}

.icon-btn[aria-pressed="true"] {
  background: var(--accent-soft);
  color: var(--accent-text);
}

.icon-btn-sm {
  width: var(--control-h-sm);
  min-width: var(--control-h-sm);
  min-height: var(--control-h-sm);
}

/* ---------- Fenêtre modale ---------- */

html.is-scroll-locked,
html.is-scroll-locked body {
  overflow: hidden;
}

.modal-root {
  position: fixed;
  inset: 0;
  z-index: var(--z-modal);
  display: flex;
  align-items: flex-end;
  justify-content: center;
}

.modal-scrim {
  position: absolute;
  inset: 0;
  background: var(--scrim);
  animation: fade-in var(--dur-2) var(--ease);
}

.modal {
  position: relative;
  display: flex;
  flex-direction: column;
  width: 100%;
  max-height: 92vh;
  max-height: 92dvh;
  border-radius: var(--r-xl) var(--r-xl) 0 0;
  background: var(--surface);
  box-shadow: var(--shadow-3);
  animation: sheet-up var(--dur-2) var(--ease);
}

.modal:focus-visible {
  outline: none;
}

.modal-grip {
  flex-shrink: 0;
  width: 36px;
  height: 4px;
  margin: var(--sp-2) auto 0;
  border-radius: var(--r-full);
  background: var(--line-strong);
}

.modal-head {
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--sp-2);
  padding: var(--sp-1) max(6px, env(safe-area-inset-right, 0px)) var(--sp-1) var(--gutter-l);
}

.modal-title {
  min-width: 0;
  font-family: var(--font-display);
  font-size: var(--fs-xl);
  font-weight: 600;
  line-height: var(--lh-tight);
  letter-spacing: 0.01em;
}

.modal-body {
  flex: 1 1 auto;
  min-height: 0;
  overflow-y: auto;
  overscroll-behavior: contain;
  -webkit-overflow-scrolling: touch;
  padding: var(--sp-2) var(--gutter-r) var(--sp-5) var(--gutter-l);
}

.modal-foot {
  flex-shrink: 0;
  display: flex;
  flex-wrap: wrap;
  gap: var(--sp-2);
  padding: var(--sp-3) var(--gutter-r) calc(var(--sp-3) + var(--safe-bottom)) var(--gutter-l);
  border-top: 1px solid var(--line);
  background: var(--surface);
}

.modal-foot > .btn {
  flex: 1 1 0;
}

@keyframes fade-in {
  from {
    opacity: 0;
  }
}

@keyframes sheet-up {
  from {
    transform: translateY(24px);
    opacity: 0;
  }
}

@keyframes dialog-in {
  from {
    transform: translateY(8px) scale(0.98);
    opacity: 0;
  }
}

@media (min-width: 640px) {
  .modal-root {
    align-items: center;
    padding: var(--sp-6);
  }

  .modal {
    width: min(100%, 560px);
    max-height: min(86vh, 780px);
    border-radius: var(--r-xl);
    animation-name: dialog-in;
  }

  .modal-root[data-size="sm"] .modal {
    width: min(100%, 420px);
  }

  .modal-root[data-size="lg"] .modal {
    width: min(100%, 780px);
  }

  .modal-grip {
    display: none;
  }

  .modal-head {
    padding: var(--sp-3) var(--sp-3) var(--sp-1) var(--sp-6);
  }

  .modal-body {
    padding: var(--sp-2) var(--sp-6) var(--sp-5);
  }

  .modal-foot {
    justify-content: flex-end;
    padding: var(--sp-3) var(--sp-6);
    border-radius: 0 0 var(--r-xl) var(--r-xl);
  }

  .modal-foot > .btn {
    flex: 0 0 auto;
  }
}

/* ---------- Notifications ---------- */

.toast-host {
  position: fixed;
  z-index: var(--z-toast);
  left: var(--gutter-l);
  right: var(--gutter-r);
  bottom: calc(var(--tabbar-h) + var(--safe-bottom) + var(--sp-3));
  display: flex;
  flex-direction: column;
  gap: var(--sp-2);
  pointer-events: none;
}

.toast {
  pointer-events: auto;
  display: flex;
  align-items: center;
  gap: 10px;
  min-height: 48px;
  padding: 6px 6px 6px 14px;
  border: 1px solid var(--toast-line);
  border-radius: var(--r-md);
  background: var(--toast-bg);
  color: var(--toast-ink);
  font-size: 0.9375rem;
  box-shadow: var(--shadow-3);
  animation: toast-in var(--dur-2) var(--ease);
}

.toast-text {
  flex: 1 1 auto;
  min-width: 0;
  padding: 6px 0;
  overflow-wrap: anywhere;
}

.toast[data-tone="in"] .toast-icon {
  color: var(--toast-in);
}

.toast[data-tone="out"] .toast-icon {
  color: var(--toast-out);
}

.toast[data-tone="warn"] .toast-icon {
  color: var(--toast-warn);
}

.toast[data-tone="info"] .toast-icon,
.toast[data-tone="neutral"] .toast-icon {
  color: var(--toast-info);
}

.toast[data-tone="accent"] .toast-icon {
  color: var(--toast-accent);
}

.toast-action {
  flex-shrink: 0;
  min-height: 36px;
  padding: 0 10px;
  border: 0;
  border-radius: var(--r-sm);
  background: none;
  color: var(--toast-accent);
  font-size: var(--fs-sm);
  font-weight: 600;
}

.toast .toast-close,
.toast .toast-close:hover:not(:disabled) {
  background: none;
  color: var(--toast-ink);
  opacity: 0.8;
}

.toast :focus-visible {
  outline-color: var(--toast-accent);
}

@keyframes toast-in {
  from {
    transform: translateY(8px);
    opacity: 0;
  }
}

@media (min-width: 900px) {
  .toast-host {
    left: auto;
    right: var(--sp-6);
    bottom: var(--sp-6);
    width: 380px;
  }
}

/* ---------- Champs ---------- */

.field {
  display: flex;
  flex-direction: column;
  gap: 6px;
  min-width: 0;
}

.field-label {
  font-size: var(--fs-sm);
  font-weight: 600;
  color: var(--ink);
}

.field-req {
  color: var(--out);
}

.field-opt {
  color: var(--ink-3);
  font-weight: 400;
}

.field-hint {
  color: var(--ink-2);
  font-size: var(--fs-sm);
  line-height: var(--lh-snug);
}

.field-error {
  display: flex;
  align-items: flex-start;
  gap: 6px;
  color: var(--out);
  font-size: var(--fs-sm);
  font-weight: 500;
  line-height: var(--lh-snug);
}

.field-error .icon {
  margin-top: 2px;
}

.input,
.input-wrap,
.money-input {
  width: 100%;
  min-width: 0;
  min-height: var(--control-h);
  border: 1px solid var(--control-line);
  border-radius: var(--r-md);
  background: var(--surface);
  color: var(--ink);
  /* 16 px au minimum : en dessous, iOS zoome sur le champ. */
  font-size: var(--fs-md);
  line-height: 1.3;
  transition: border-color var(--dur-1) var(--ease), box-shadow var(--dur-1) var(--ease);
}

.input {
  display: block;
  padding: 0 var(--sp-3);
  -webkit-appearance: none;
  appearance: none;
}

.input::placeholder,
.money-input-field::placeholder {
  color: var(--ink-3);
  opacity: 1;
}

.input:hover:not(:disabled),
.input-wrap:hover,
.money-input:hover {
  border-color: var(--ink-3);
}

.input:focus-visible,
.input-wrap:focus-within,
.money-input:focus-within {
  outline: 2px solid var(--focus);
  outline-offset: 1px;
  border-color: var(--focus);
  border-radius: var(--r-md);
}

.input:disabled,
.money-input.is-disabled {
  background: var(--surface-2);
  border-color: var(--line-strong);
  color: var(--ink-3);
  cursor: not-allowed;
}

.input[aria-invalid="true"],
.field.has-error .input-wrap,
.field.has-error .money-input,
.money-input:has([aria-invalid="true"]) {
  border-color: var(--out);
}

.input-wrap {
  display: flex;
  align-items: center;
}

.input-wrap .input {
  flex: 1 1 auto;
  min-height: calc(var(--control-h) - 2px);
  border: 0;
  background: none;
}

.input-wrap .input:focus-visible {
  outline: none;
}

.input-affix {
  flex-shrink: 0;
  display: inline-flex;
  align-items: center;
  padding: 0 var(--sp-3);
  color: var(--ink-2);
  font-size: 0.9375rem;
}

.input-affix:first-child {
  padding-right: 0;
}

.input-affix:last-child {
  padding-left: 0;
}

.textarea {
  min-height: calc(var(--control-h) * 2);
  padding: 10px var(--sp-3);
  line-height: var(--lh-body);
  resize: vertical;
}

.input-date {
  /* Safari iOS : sans cela un champ date vide s'écrase. */
  min-width: 9.5em;
  font-variant-numeric: tabular-nums;
}

.input-date::-webkit-date-and-time-value {
  text-align: left;
}

.select-wrap {
  position: relative;
  display: block;
  min-width: 0;
}

.select {
  padding-right: 38px;
  text-overflow: ellipsis;
  cursor: pointer;
}

.select.is-placeholder {
  color: var(--ink-3);
}

.select option,
.select optgroup {
  color: var(--ink);
  background: var(--surface);
}

.select-caret {
  position: absolute;
  top: 50%;
  right: 12px;
  margin-top: -9px;
  color: var(--ink-2);
  pointer-events: none;
}

.select-sm .select {
  min-height: var(--control-h-sm);
  padding-left: 10px;
  padding-right: 32px;
  border-radius: var(--r-sm);
  font-size: 0.9375rem;
}

.select-sm .select-caret {
  right: 8px;
}

/* Choix exclusif. */
.segmented {
  display: inline-flex;
  max-width: 100%;
  min-height: var(--control-h);
  padding: 3px;
  border-radius: var(--r-md);
  background: var(--sunken);
}

.segmented-full {
  display: flex;
  container-type: inline-size;
}

/* Rangée pleine largeur trop étroite pour trois libellés et leurs icônes : on garde les mots. */
@container (max-width: 350px) {
  .segmented-full .segmented-item {
    padding: 0 var(--sp-2);
  }

  .segmented-full .segmented-item .icon {
    display: none;
  }
}

.segmented-item {
  position: relative;
  flex: 1 1 auto;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  min-width: 0;
  padding: 0 var(--sp-3);
  border: 0;
  border-radius: 9px;
  background: none;
  color: var(--ink-2);
  font-size: 0.9375rem;
  font-weight: 600;
  white-space: nowrap;
  transition: background-color var(--dur-1) var(--ease), color var(--dur-1) var(--ease);
}

.segmented-item > span {
  overflow: hidden;
  text-overflow: ellipsis;
}

.segmented-item:hover:not(:disabled) {
  color: var(--ink);
}

.segmented-item.is-on {
  background: var(--surface);
  color: var(--ink);
  box-shadow: var(--shadow-1);
}

.segmented-item:disabled {
  opacity: 0.5;
}

.segmented-sm {
  min-height: var(--control-h-sm);
  border-radius: var(--r-sm);
}

.segmented-sm .segmented-item {
  padding: 0 10px;
  border-radius: 6px;
  font-size: var(--fs-sm);
}

/* Interrupteur et case à cocher. */
.toggle,
.checkbox {
  position: relative;
  display: inline-flex;
  align-items: center;
  gap: var(--sp-3);
  min-height: 44px;
  cursor: pointer;
  user-select: none;
}

.toggle.is-disabled,
.checkbox.is-disabled {
  cursor: not-allowed;
  opacity: 0.55;
}

.toggle-input,
.checkbox-input {
  position: absolute;
  width: 1px;
  height: 1px;
  margin: 0;
  opacity: 0;
  pointer-events: none;
}

.toggle-track {
  flex-shrink: 0;
  display: inline-flex;
  align-items: center;
  width: 44px;
  height: 26px;
  padding: 3px;
  border-radius: var(--r-full);
  background: var(--control-line);
  transition: background-color var(--dur-1) var(--ease);
}

.toggle-thumb {
  width: 20px;
  height: 20px;
  border-radius: var(--r-full);
  background: var(--surface);
  box-shadow: var(--shadow-1);
  transition: transform var(--dur-1) var(--ease);
}

.toggle-input:checked + .toggle-track {
  background: var(--accent);
}

.toggle-input:checked + .toggle-track .toggle-thumb {
  transform: translateX(18px);
  background: var(--on-accent);
}

.toggle-input:focus-visible + .toggle-track,
.checkbox-input:focus-visible + .checkbox-box {
  outline: 2px solid var(--focus);
  outline-offset: 2px;
}

.toggle-text {
  display: flex;
  flex-direction: column;
  min-width: 0;
  padding: 6px 0;
}

.toggle-label,
.checkbox-label {
  font-size: 0.9375rem;
  line-height: var(--lh-snug);
}

.toggle-label {
  font-weight: 500;
}

.toggle-hint {
  color: var(--ink-2);
  font-size: var(--fs-sm);
  line-height: var(--lh-snug);
}

.checkbox-box {
  flex-shrink: 0;
  display: grid;
  place-items: center;
  width: 22px;
  height: 22px;
  border: 1.5px solid var(--control-line);
  border-radius: 6px;
  background: var(--surface);
  color: transparent;
  transition: background-color var(--dur-1) var(--ease), border-color var(--dur-1) var(--ease);
}

.checkbox-input:checked + .checkbox-box,
.checkbox-input:indeterminate + .checkbox-box {
  border-color: var(--accent);
  background: var(--accent);
  color: var(--on-accent);
}

.checkbox-box .icon {
  stroke-width: 3;
}

/* Recherche. */
.search {
  position: relative;
  display: block;
  min-width: 0;
}

.search-icon {
  position: absolute;
  top: 50%;
  left: 12px;
  margin-top: -9px;
  color: var(--ink-3);
  pointer-events: none;
}

.search-input {
  padding-left: 38px;
  padding-right: 42px;
}

.search-input::-webkit-search-cancel-button,
.search-input::-webkit-search-decoration {
  -webkit-appearance: none;
  appearance: none;
}

.search-clear {
  position: absolute;
  top: 50%;
  right: 4px;
  display: grid;
  place-items: center;
  width: 36px;
  height: 36px;
  margin-top: -18px;
  border: 0;
  border-radius: var(--r-full);
  background: none;
  color: var(--ink-2);
}

.search-clear:hover {
  background: var(--sunken);
  color: var(--ink);
}

/* Montant. */
.money-input {
  display: flex;
  align-items: center;
  overflow: hidden;
}

.money-input-sign {
  flex-shrink: 0;
  padding-left: var(--sp-3);
  font-size: var(--fs-lg);
  font-weight: 600;
  line-height: 1;
}

.money-input-out .money-input-sign {
  color: var(--out);
}

.money-input-in .money-input-sign {
  color: var(--in);
}

.money-input-field {
  flex: 1 1 auto;
  width: 100%;
  min-width: 0;
  min-height: calc(var(--control-h) - 2px);
  padding: 0 var(--sp-2) 0 var(--sp-3);
  border: 0;
  background: none;
  color: inherit;
  font-size: var(--fs-lg);
  font-weight: 600;
}

.money-input-sign + .money-input-field {
  padding-left: 6px;
}

.money-input-field:focus-visible {
  outline: none;
}

.money-input-unit {
  flex-shrink: 0;
  padding-right: var(--sp-3);
  color: var(--ink-2);
  font-weight: 600;
}

.money-input-currency {
  position: relative;
  flex-shrink: 0;
  align-self: stretch;
  display: inline-flex;
  align-items: stretch;
  border-left: 1px solid var(--line-strong);
  background: var(--surface-2);
}

.money-input-currency::after {
  content: "";
  position: absolute;
  top: 50%;
  right: 11px;
  width: 6px;
  height: 6px;
  margin-top: -5px;
  border-right: 1.75px solid var(--ink-2);
  border-bottom: 1.75px solid var(--ink-2);
  transform: rotate(45deg);
  pointer-events: none;
}

.money-input-currency select {
  min-height: calc(var(--control-h) - 2px);
  padding: 0 28px 0 12px;
  border: 0;
  border-radius: 0;
  background: none;
  color: var(--ink);
  font-size: var(--fs-md);
  font-weight: 600;
  -webkit-appearance: none;
  appearance: none;
  cursor: pointer;
}

.money-input-currency select:focus-visible {
  outline-offset: -3px;
  border-radius: var(--r-sm);
}

.money-input-currency select option {
  color: var(--ink);
  background: var(--surface);
}

/* Dépôt de fichier. */
.filedrop {
  position: relative;
  display: flex;
  align-items: center;
  gap: var(--sp-3);
  min-height: 76px;
  padding: var(--sp-4);
  border: 1.5px dashed var(--control-line);
  border-radius: var(--r-lg);
  background: var(--surface-2);
  cursor: pointer;
  transition: background-color var(--dur-1) var(--ease), border-color var(--dur-1) var(--ease);
}

.filedrop:hover,
.filedrop.is-over {
  border-color: var(--accent);
  background: var(--accent-soft);
}

.filedrop:focus-within {
  outline: 2px solid var(--focus);
  outline-offset: 2px;
}

.filedrop.is-disabled {
  opacity: 0.55;
  cursor: not-allowed;
}

.filedrop-input {
  position: absolute;
  width: 1px;
  height: 1px;
  opacity: 0;
  pointer-events: none;
}

.filedrop-icon {
  flex-shrink: 0;
  display: grid;
  place-items: center;
  width: 44px;
  height: 44px;
  border-radius: var(--r-full);
  background: var(--accent-soft);
  color: var(--accent-text);
}

.filedrop:hover .filedrop-icon,
.filedrop.is-over .filedrop-icon {
  background: var(--surface);
}

.filedrop-text {
  display: flex;
  flex-direction: column;
  gap: 2px;
  min-width: 0;
}

.filedrop-label {
  font-weight: 600;
}

.filedrop-hint {
  color: var(--ink-2);
  font-size: var(--fs-sm);
  line-height: var(--lh-snug);
}

.filedrop-compact {
  min-height: var(--control-h);
  padding: 6px var(--sp-3);
  border-radius: var(--r-md);
}

.filedrop-compact .filedrop-icon {
  width: 28px;
  height: 28px;
  background: none;
}

.filedrop-compact .filedrop-text {
  flex-direction: row;
  flex-wrap: wrap;
  align-items: baseline;
  gap: 0 var(--sp-2);
}

.filedrop-compact .filedrop-label {
  font-size: 0.9375rem;
}

/* ---------- Étiquettes et pastilles ---------- */

.badge {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  max-width: 100%;
  min-height: 22px;
  padding: 0 8px;
  border-radius: var(--r-full);
  background: var(--sunken);
  color: var(--ink-2);
  font-size: var(--fs-xs);
  font-weight: 600;
  line-height: 1.2;
  white-space: nowrap;
  vertical-align: middle;
}

.badge-text {
  overflow: hidden;
  text-overflow: ellipsis;
}

.badge[data-tone="accent"] {
  background: var(--accent-soft);
  color: var(--accent-text);
}

.badge[data-tone="in"] {
  background: var(--in-soft);
  color: var(--in);
}

.badge[data-tone="out"] {
  background: var(--out-soft);
  color: var(--out);
}

.badge[data-tone="warn"] {
  background: var(--warn-soft);
  color: var(--warn);
}

.badge[data-tone="info"] {
  background: var(--info-soft);
  color: var(--info);
}

.chip {
  display: inline-flex;
  align-items: center;
  flex-shrink: 0;
  max-width: 100%;
  min-height: 36px;
  border: 1px solid var(--line-strong);
  border-radius: var(--r-full);
  background: var(--surface);
  color: var(--ink);
  font-size: var(--fs-sm);
  font-weight: 500;
  white-space: nowrap;
  transition: background-color var(--dur-1) var(--ease), border-color var(--dur-1) var(--ease), color var(--dur-1) var(--ease);
}

.chip:not(:has(.chip-main)) {
  gap: 6px;
  padding: 0 12px;
}

.chip-main {
  position: relative;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  min-width: 0;
  min-height: 34px;
  padding: 0 12px;
  border: 0;
  border-radius: var(--r-full);
  background: none;
  color: inherit;
  font: inherit;
}

.chip-text {
  overflow: hidden;
  text-overflow: ellipsis;
}

.chip:has(button.chip-main:hover:not(:disabled)) {
  border-color: var(--control-line);
  background: var(--surface-2);
}

.chip.is-on {
  border-color: var(--accent);
  background: var(--accent-soft);
  color: var(--accent-text);
  font-weight: 600;
}

.chip-removable .chip-main {
  padding-right: 4px;
}

.chip-remove {
  position: relative;
  display: grid;
  place-items: center;
  width: 26px;
  height: 26px;
  margin-right: 4px;
  border: 0;
  border-radius: var(--r-full);
  background: none;
  color: inherit;
  opacity: 0.75;
}

.chip-remove:hover {
  background: var(--sunken);
  opacity: 1;
}

/* Rangée de pastilles : défile de côté sur téléphone, passe à la ligne sur grand écran. */
.chip-row {
  display: flex;
  gap: var(--sp-2);
  margin: 0 calc(-1 * var(--gutter-r)) 0 calc(-1 * var(--gutter-l));
  padding: 2px var(--gutter-r) 2px var(--gutter-l);
  overflow-x: auto;
  scrollbar-width: none;
  -webkit-overflow-scrolling: touch;
}

.chip-row::-webkit-scrollbar {
  display: none;
}

@media (min-width: 900px) {
  .chip-row {
    flex-wrap: wrap;
    margin: 0;
    padding: 0;
    overflow: visible;
  }
}

/* ---------- Cartes et sections ---------- */

.card {
  display: block;
  min-width: 0;
  border: 1px solid var(--line);
  border-radius: var(--r-lg);
  background: var(--surface);
  box-shadow: var(--shadow-1);
}

.card-pad {
  padding: var(--sp-4);
}

.card-pad-sm {
  padding: var(--sp-3);
}

.card-pad-lg {
  padding: var(--sp-5);
}

.card-flat {
  border-color: transparent;
  background: var(--surface-2);
  box-shadow: none;
}

.card-action {
  width: 100%;
  color: inherit;
  font: inherit;
  text-align: left;
  transition: border-color var(--dur-1) var(--ease), background-color var(--dur-1) var(--ease);
}

.card-action:hover {
  border-color: var(--control-line);
}

.card-action:focus-visible {
  border-radius: var(--r-lg);
}

@media (min-width: 900px) {
  .card-pad {
    padding: var(--sp-5);
  }

  .card-pad-lg {
    padding: var(--sp-6);
  }
}

.section {
  display: flex;
  flex-direction: column;
  gap: var(--sp-3);
  min-width: 0;
}

.section-head {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: var(--sp-3);
  min-height: 32px;
}

.section-heading {
  min-width: 0;
}

.section-title {
  font-family: var(--font-display);
  font-size: var(--fs-xl);
  font-weight: 600;
  line-height: var(--lh-tight);
  letter-spacing: 0.01em;
}

.section-sub {
  margin-top: 2px;
  color: var(--ink-2);
  font-size: var(--fs-sm);
}

.section-action {
  flex-shrink: 0;
  display: flex;
  align-items: center;
  gap: var(--sp-2);
}

/* ---------- Liste de lignes ---------- */

.list {
  display: flex;
  flex-direction: column;
  min-width: 0;
}

.list-item {
  display: flex;
  align-items: center;
  gap: var(--sp-3);
  width: 100%;
  min-width: 0;
  min-height: 56px;
  padding: 10px 14px;
  border: 0;
  border-bottom: 1px solid var(--line);
  background: none;
  color: inherit;
  font: inherit;
  text-align: left;
}

.list > li:last-child > .list-item {
  border-bottom: 0;
}

.list-item-action:hover:not(:disabled) {
  background: var(--surface-2);
}

.list-item-action:focus-visible {
  outline-offset: -3px;
  border-radius: var(--r-sm);
}

.list-item-action:disabled {
  opacity: 0.55;
}

.list-lead {
  flex-shrink: 0;
  display: grid;
  place-items: center;
  width: 36px;
  height: 36px;
  border-radius: var(--r-sm);
  background: var(--sunken);
  color: var(--ink-2);
}

.list-lead[data-tone="accent"] {
  background: var(--accent-soft);
  color: var(--accent-text);
}

.list-lead[data-tone="in"] {
  background: var(--in-soft);
  color: var(--in);
}

.list-lead[data-tone="out"] {
  background: var(--out-soft);
  color: var(--out);
}

.list-lead[data-tone="warn"] {
  background: var(--warn-soft);
  color: var(--warn);
}

.list-lead[data-tone="info"] {
  background: var(--info-soft);
  color: var(--info);
}

.list-lead-free {
  flex-shrink: 0;
  display: inline-flex;
  align-items: center;
}

.list-body {
  flex: 1 1 auto;
  display: flex;
  flex-direction: column;
  gap: 1px;
  min-width: 0;
}

.list-title {
  font-weight: 500;
  line-height: var(--lh-snug);
}

.list-sub {
  color: var(--ink-2);
  font-size: var(--fs-sm);
  line-height: var(--lh-snug);
}

.list-trail {
  flex-shrink: 0;
  display: inline-flex;
  align-items: center;
  gap: var(--sp-2);
  color: var(--ink-2);
  font-size: 0.9375rem;
}

.list-chevron {
  color: var(--ink-3);
}

.card > .list {
  overflow: hidden;
  border-radius: inherit;
}

/* ---------- État vide, bandeau, attente ---------- */

.empty {
  display: flex;
  align-items: flex-start;
  gap: var(--sp-3);
  padding: var(--sp-5) var(--sp-4);
  border: 1px dashed var(--line-strong);
  border-radius: var(--r-lg);
}

.empty-icon {
  flex-shrink: 0;
  display: grid;
  place-items: center;
  width: 44px;
  height: 44px;
  border-radius: var(--r-md);
  background: var(--accent-soft);
  color: var(--accent-text);
}

.empty-body {
  min-width: 0;
}

.empty-title {
  font-weight: 600;
  line-height: var(--lh-snug);
}

.empty-text {
  max-width: 56ch;
  margin-top: 4px;
  color: var(--ink-2);
  font-size: 0.9375rem;
}

.empty-action {
  display: flex;
  flex-wrap: wrap;
  gap: var(--sp-2);
  margin-top: var(--sp-3);
}

.empty-compact {
  padding: var(--sp-3);
  border: 0;
}

.empty-compact .empty-icon {
  width: 36px;
  height: 36px;
  border-radius: var(--r-sm);
}

.banner {
  display: flex;
  flex-wrap: wrap;
  align-items: flex-start;
  gap: var(--sp-2) var(--sp-3);
  padding: var(--sp-3) var(--sp-3) var(--sp-3) 14px;
  border-radius: var(--r-md);
  background: var(--sunken);
  color: var(--ink);
  font-size: 0.9375rem;
  line-height: var(--lh-snug);
}

.banner-icon {
  margin-top: 1px;
  color: var(--ink-2);
}

.banner-body {
  flex: 1 1 200px;
  min-width: 0;
}

.banner-title {
  font-weight: 600;
}

.banner-title + .banner-text {
  margin-top: 2px;
  color: var(--ink-2);
}

.banner-action {
  flex-shrink: 0;
  display: flex;
  flex-wrap: wrap;
  gap: var(--sp-2);
  margin: -4px 0;
  padding-left: 30px;
}

.banner-close {
  margin: -6px -4px -6px 0;
}

.banner[data-tone="info"] {
  background: var(--info-soft);
}

.banner[data-tone="info"] .banner-icon {
  color: var(--info);
}

.banner[data-tone="warn"] {
  background: var(--warn-soft);
}

.banner[data-tone="warn"] .banner-icon {
  color: var(--warn);
}

.banner[data-tone="in"] {
  background: var(--in-soft);
}

.banner[data-tone="in"] .banner-icon {
  color: var(--in);
}

.banner[data-tone="out"] {
  background: var(--out-soft);
}

.banner[data-tone="out"] .banner-icon {
  color: var(--out);
}

.banner[data-tone="accent"] {
  background: var(--accent-soft);
}

.banner[data-tone="accent"] .banner-icon {
  color: var(--accent-text);
}

@media (min-width: 640px) {
  .banner {
    flex-wrap: nowrap;
    align-items: center;
  }

  .banner-icon {
    align-self: flex-start;
    margin-top: 2px;
  }

  .banner-action {
    padding-left: 0;
  }
}

.skeleton {
  display: block;
  border-radius: var(--r-xs);
  background: linear-gradient(90deg, var(--sunken) 25%, var(--surface-2) 45%, var(--sunken) 65%) 0 0 / 300% 100%;
  animation: skeleton 1.6s ease-in-out infinite;
}

.skeleton-lines {
  display: flex;
  flex-direction: column;
  gap: 0.6em;
}

@keyframes skeleton {
  from {
    background-position: 100% 0;
  }

  to {
    background-position: 0 0;
  }
}

.progress {
  --progress-fill: var(--accent);
  --progress-track: var(--accent-soft);
  display: flex;
  align-items: center;
  gap: var(--sp-2);
  min-width: 0;
}

.progress-track {
  flex: 1 1 auto;
  height: 8px;
  overflow: hidden;
  border-radius: var(--r-full);
  background: var(--progress-track);
}

.progress-fill {
  height: 100%;
  border-radius: var(--r-full);
  background: var(--progress-fill);
  transition: width var(--dur-2) var(--ease);
}

.progress-value {
  flex-shrink: 0;
  min-width: 3.2em;
  color: var(--ink-2);
  font-size: var(--fs-sm);
  text-align: right;
}

.progress[data-tone="in"] {
  --progress-fill: var(--in-fill);
  --progress-track: var(--in-soft);
}

.progress[data-tone="out"] {
  --progress-fill: var(--out-fill);
  --progress-track: var(--out-soft);
}

.progress[data-tone="warn"] {
  --progress-fill: var(--warn-fill);
  --progress-track: var(--warn-soft);
}

.progress[data-tone="info"] {
  --progress-fill: var(--info-fill);
  --progress-track: var(--info-soft);
}

.progress[data-tone="neutral"] {
  --progress-fill: var(--ink-3);
  --progress-track: var(--sunken);
}

/* ---------- Personnes et montants ---------- */

.dot {
  display: inline-block;
  flex-shrink: 0;
  border-radius: var(--r-full);
  vertical-align: baseline;
}

.avatar {
  display: inline-grid;
  place-items: center;
  flex-shrink: 0;
  width: 32px;
  height: 32px;
  border-radius: var(--r-full);
  font-size: var(--fs-xs);
  font-weight: 700;
  line-height: 1;
  letter-spacing: 0.02em;
  user-select: none;
}

.avatar-sm {
  width: 24px;
  height: 24px;
  font-size: 0.625rem;
}

.avatar-lg {
  width: 40px;
  height: 40px;
  font-size: var(--fs-sm);
}

.money {
  font-weight: inherit;
}

/* ---------- Tuile de chiffre : le billet ---------- */

.stat {
  display: block;
  min-width: 0;
  padding: 0;
  border: 0;
  background: none;
  color: var(--ink);
  font: inherit;
  text-align: left;
  /* L'ombre suit la découpe du billet (le masque est sur .stat-card). */
  filter: drop-shadow(0 0 0.6px var(--ticket-edge)) drop-shadow(0 1px 1.5px var(--ticket-shadow));
}

.stat-card {
  --stub-w: 30px;
  --notch: 7px;
  --stub-bg: var(--ticket-stub);
  --stub-ink: var(--ink-2);
  position: relative;
  display: grid;
  grid-template-columns: var(--stub-w) minmax(0, 1fr);
  height: 100%;
  min-height: 98px;
  overflow: hidden;
  border-radius: var(--r-md);
  background: var(--ticket);
  /* Deux encoches rondes, en haut et en bas de la ligne de perforation. */
  -webkit-mask: radial-gradient(circle var(--notch) at var(--stub-w) 0, transparent 96%, var(--mask-solid)) top / 100% 51% no-repeat,
    radial-gradient(circle var(--notch) at var(--stub-w) 100%, transparent 96%, var(--mask-solid)) bottom / 100% 51% no-repeat;
  mask: radial-gradient(circle var(--notch) at var(--stub-w) 0, transparent 96%, var(--mask-solid)) top / 100% 51% no-repeat,
    radial-gradient(circle var(--notch) at var(--stub-w) 100%, transparent 96%, var(--mask-solid)) bottom / 100% 51% no-repeat;
}

.stat-stub {
  position: relative;
  display: grid;
  place-items: center;
  min-height: 0;
  overflow: hidden;
  background: var(--stub-bg);
  color: var(--stub-ink);
}

/* La ligne de perforation : des petits points entre le talon et le billet. */
.stat-card::after {
  content: "";
  position: absolute;
  top: calc(var(--notch) + 5px);
  bottom: calc(var(--notch) + 5px);
  left: calc(var(--stub-w) - 1.5px);
  width: 3px;
  background: radial-gradient(circle, var(--ticket-edge) 1.2px, transparent 1.7px) center top / 3px 7px repeat-y;
}

/* Hors flux : un talon trop long est coupé (points de suspension) au lieu d'agrandir le billet. */
.stat-stub-text {
  position: absolute;
  top: calc(var(--notch) + 4px);
  bottom: calc(var(--notch) + 4px);
  left: 0;
  right: 0;
  overflow: hidden;
  font-family: var(--font-display);
  font-size: var(--fs-xs);
  font-weight: 600;
  line-height: var(--stub-w);
  letter-spacing: 0.14em;
  text-align: center;
  text-overflow: ellipsis;
  text-transform: uppercase;
  white-space: nowrap;
  writing-mode: vertical-rl;
  transform: rotate(180deg);
}

.stat-body {
  container-type: inline-size;
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 3px;
  min-width: 0;
  padding: 11px 12px 11px 14px;
}

.stat-label {
  font-family: var(--font-display);
  font-size: 0.8125rem;
  font-weight: 600;
  line-height: 1.15;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--ink-2);
}

/* Chiffres proportionnels pour un grand nombre isolé ; la taille suit la largeur du billet. */
.stat-value {
  font-size: 1.375rem;
  font-size: clamp(1.0625rem, 15.5cqi, 1.75rem);
  font-weight: 700;
  line-height: 1.15;
  letter-spacing: -0.012em;
  font-variant-numeric: normal;
  white-space: nowrap;
}

.stat-foot {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 2px 8px;
  min-height: 18px;
  color: var(--ink-2);
  font-size: var(--fs-xs);
  line-height: 1.3;
}

.stat-sub {
  min-width: 0;
}

.stat-spark {
  margin-left: auto;
}

.stat-trend {
  display: inline-flex;
  align-items: center;
  gap: 2px;
  font-weight: 600;
  white-space: nowrap;
}

.stat-trend[data-good="yes"] {
  color: var(--in);
}

.stat-trend[data-good="no"] {
  color: var(--out);
}

.stat[data-tone="accent"] .stat-card {
  --stub-bg: var(--accent-soft);
  --stub-ink: var(--accent-text);
}

.stat[data-tone="in"] .stat-card {
  --stub-bg: var(--in-soft);
  --stub-ink: var(--in);
}

.stat[data-tone="out"] .stat-card {
  --stub-bg: var(--out-soft);
  --stub-ink: var(--out);
}

.stat[data-tone="warn"] .stat-card {
  --stub-bg: var(--warn-soft);
  --stub-ink: var(--warn);
}

.stat[data-tone="info"] .stat-card {
  --stub-bg: var(--info-soft);
  --stub-ink: var(--info);
}

.stat-action {
  cursor: pointer;
  transition: transform var(--dur-1) var(--ease);
}

.stat-action:hover {
  transform: translateY(-1px);
}

.stat-action:focus-visible {
  border-radius: var(--r-md);
}

@media (min-width: 640px) {
  .stat-card {
    --stub-w: 34px;
    min-height: 108px;
  }

  .stat-body {
    padding: 12px 14px 12px 18px;
  }
}

/* ---------- Onglets ---------- */

.tabs {
  display: flex;
  flex-direction: column;
  gap: var(--sp-4);
  min-width: 0;
}

.tabs-list {
  display: flex;
  gap: var(--sp-1);
  overflow-x: auto;
  border-bottom: 1px solid var(--line);
  scrollbar-width: none;
  -webkit-overflow-scrolling: touch;
}

.tabs-list::-webkit-scrollbar {
  display: none;
}

.tab {
  flex-shrink: 0;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  min-height: 44px;
  margin-bottom: -1px;
  padding: 0 var(--sp-3);
  border: 0;
  border-bottom: 2px solid transparent;
  background: none;
  color: var(--ink-2);
  font-size: 0.9375rem;
  font-weight: 600;
  white-space: nowrap;
  transition: color var(--dur-1) var(--ease), border-color var(--dur-1) var(--ease);
}

.tab:hover {
  color: var(--ink);
}

.tab.is-on {
  border-bottom-color: var(--accent);
  color: var(--accent-text);
}

.tab:focus-visible {
  outline-offset: -3px;
  border-radius: var(--r-sm);
}

.tab-count {
  min-width: 20px;
  padding: 1px 6px;
  border-radius: var(--r-full);
  background: var(--sunken);
  color: var(--ink-2);
  font-size: var(--fs-xs);
  font-weight: 600;
  text-align: center;
}

.tab.is-on .tab-count {
  background: var(--accent-soft);
  color: var(--accent-text);
}

.tabs-panel {
  min-width: 0;
}

.tabs-panel:focus-visible {
  outline-offset: 4px;
  border-radius: var(--r-sm);
}

/* ---------- Menu ---------- */

.menu-wrap {
  display: inline-flex;
}

.menu {
  position: fixed;
  z-index: var(--z-pop);
  top: 0;
  left: 0;
  min-width: 208px;
  max-width: min(320px, calc(100vw - 16px));
  max-height: calc(100vh - 16px);
  overflow-y: auto;
  padding: 6px;
  border: 1px solid var(--line);
  border-radius: var(--r-md);
  background: var(--pop);
  box-shadow: var(--shadow-3);
  animation: fade-in var(--dur-1) var(--ease);
}

.menu-item {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  min-height: 44px;
  padding: 0 10px;
  border: 0;
  border-radius: var(--r-sm);
  background: none;
  color: var(--ink);
  font-size: 0.9375rem;
  font-weight: 500;
  text-align: left;
}

.menu-item .icon {
  color: var(--ink-2);
}

.menu-item:hover:not(:disabled),
.menu-item:focus-visible {
  outline: none;
  background: var(--sunken);
}

.menu-item:disabled {
  opacity: 0.45;
}

.menu-item.is-danger,
.menu-item.is-danger .icon {
  color: var(--out);
}

.menu-item-label {
  flex: 1 1 auto;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.menu-item-hint {
  flex-shrink: 0;
  color: var(--ink-3);
  font-size: var(--fs-sm);
  font-weight: 400;
}

.menu-sep {
  height: 1px;
  margin: 6px 4px;
  background: var(--line);
}

@media (min-width: 900px) and (pointer: fine) {
  .menu-item {
    min-height: 36px;
  }
}

/* ---------- Tableau ---------- */

.table-wrap {
  min-width: 0;
}

.table {
  width: 100%;
  font-size: 0.9375rem;
}

.table th {
  padding: 10px 14px;
  border-bottom: 1px solid var(--line);
  color: var(--ink-3);
  font-family: var(--font-display);
  font-size: 0.8125rem;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-align: left;
  text-transform: uppercase;
  white-space: nowrap;
}

.table td {
  padding: 12px 14px;
  border-bottom: 1px solid var(--line);
  vertical-align: middle;
}

.table tbody tr:last-child td {
  border-bottom: 0;
}

.table .is-num {
  text-align: right;
}

.table .is-center {
  text-align: center;
}

.table tr.is-clickable {
  cursor: pointer;
}

.table tr.is-clickable:hover td {
  background: var(--surface-2);
}

.table tr.is-clickable:focus-visible {
  outline-offset: -2px;
}

.table tfoot td {
  border-top: 1px solid var(--line-strong);
  border-bottom: 0;
  background: var(--surface-2);
  font-weight: 600;
}

.table-dense td {
  padding-top: 8px;
  padding-bottom: 8px;
}

.table-empty {
  padding: var(--sp-4);
}

.table-stack {
  display: flex;
  flex-direction: column;
  min-width: 0;
}

.trow {
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 2px;
  width: 100%;
  min-width: 0;
  min-height: 56px;
  padding: 10px 14px;
  border: 0;
  border-bottom: 1px solid var(--line);
  background: none;
  color: inherit;
  font: inherit;
  text-align: left;
}

.table-stack > li:last-child > .trow,
.table-stack > li.trow:last-child {
  border-bottom: 0;
}

.trow-action:hover {
  background: var(--surface-2);
}

.trow-action:focus-visible {
  outline-offset: -3px;
  border-radius: var(--r-sm);
}

.trow-line {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: var(--sp-3);
  min-width: 0;
}

.trow-title {
  min-width: 0;
  overflow: hidden;
  font-weight: 500;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.trow-amount {
  flex-shrink: 0;
  font-weight: 600;
}

.trow-line-sub {
  color: var(--ink-2);
  font-size: var(--fs-sm);
}

/* Les détails s'enchaînent, séparés par un point ; le point qui tomberait en début de ligne est masqué. */
.trow-sub {
  flex: 1 1 auto;
  min-width: 0;
  overflow: hidden;
}

.trow-sub-in {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 2px 0;
  margin-left: -17px;
}

.trow-sub-item {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  min-width: 0;
}

.trow-sub .trow-sub-item::before {
  content: "\00b7";
  flex-shrink: 0;
  width: 17px;
  color: var(--ink-3);
  text-align: center;
}

.trow-sub .trow-sub-item {
  gap: 0;
}

.trow-sub .trow-sub-item > * + * {
  margin-left: 4px;
}

.trow-sub-label {
  color: var(--ink-3);
}

.trow-aside {
  flex-shrink: 0;
  display: inline-flex;
  align-items: center;
  gap: 6px;
}

.trow-foot {
  background: var(--surface-2);
  border-top: 1px solid var(--line-strong);
  border-bottom: 0;
}

.trow-foot .trow-title {
  font-weight: 600;
}

.table-dense .trow {
  min-height: 48px;
  padding-top: 8px;
  padding-bottom: 8px;
}

/* Un tableau posé bord à bord dans une carte (Card pad={false}) épouse ses coins. */
.card > .table-wrap,
.card > .table-stack {
  overflow: hidden;
  border-radius: inherit;
}

.card > .table-wrap {
  overflow-x: auto;
}

.trow-sub-value {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  min-width: 0;
}

/* Si Barlow Condensed ne se charge pas, on demande au moins la graisse étroite de la police de secours. */
.page-title,
.h1,
.h2,
.overline,
.app-brand,
.app-tab,
.app-nav-label,
.boot-bar,
.modal-title,
.section-title,
.stat-label,
.stat-stub-text,
.table th {
  font-stretch: condensed;
}

/*
  Styles propres aux vues.
  Ce fichier est réservé aux règles partagées par plusieurs vues ; il est vide pour l'instant.
  Chaque vue écrit ses règles dans son propre fichier src/styles/views-<nom>.css (chargé après celui-ci),
  avec des classes préfixées par le nom de la vue (.dash-..., .ops-..., .partners-...) et uniquement
  les jetons de tokens.css pour les couleurs, les espacements et les rayons.
*/

/*
  Styles des graphiques (src/ui/charts). Marques fines, grille discrète, texte à l'encre des jetons :
  la couleur d'une série n'est portée que par sa marque (barre, trait, pastille), jamais par le texte.
*/

.chart {
  display: flex;
  flex-direction: column;
  gap: var(--sp-2);
  min-width: 0;
  margin: 0;
}

.chart-caption {
  display: flex;
  flex-direction: column;
  gap: 1px;
}

.chart-title {
  font-weight: 600;
  line-height: var(--lh-snug);
}

.chart-sub {
  color: var(--ink-2);
  font-size: var(--fs-sm);
}

.chart-plot {
  position: relative;
  min-width: 0;
}

.chart-plot:focus-visible {
  outline-offset: 4px;
  border-radius: var(--r-sm);
}

.chart-svg {
  display: block;
  overflow: visible;
  /* Glisser de côté parcourt le graphique ; glisser de haut en bas fait toujours défiler la page. */
  touch-action: pan-y;
  user-select: none;
  -webkit-user-select: none;
}

.chart-grid {
  stroke: var(--chart-grid);
  stroke-width: 1;
  shape-rendering: crispEdges;
}

.chart-axis {
  stroke: var(--chart-axis);
  stroke-width: 1;
  shape-rendering: crispEdges;
}

.chart-cross {
  stroke: var(--chart-axis);
  stroke-width: 1;
  shape-rendering: crispEdges;
}

.chart-tick {
  fill: var(--ink-3);
  font-family: var(--font-ui);
  font-size: 11px;
  font-variant-numeric: tabular-nums;
}

.chart-band {
  fill: var(--chart-hover);
}

.chart-mark {
  transition: opacity var(--dur-1) var(--ease);
}

.chart-mark.is-dim {
  opacity: 0.5;
}

.chart-line {
  fill: none;
  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.chart-area {
  opacity: 0.1;
}

/* Anneau de 2 px à la couleur de la surface autour des points. */
.chart-dot {
  stroke: var(--surface);
  stroke-width: 2;
}

.sparkline {
  display: block;
  flex-shrink: 0;
  overflow: visible;
}

.sparkline-line {
  fill: none;
  stroke: var(--chart-muted);
  stroke-width: 1.5;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.stat .chart-dot {
  stroke: var(--ticket);
}

/* Infobulle : la valeur d'abord, le nom ensuite. */
.chart-tip {
  position: absolute;
  z-index: 2;
  top: 0;
  left: 0;
  min-width: 88px;
  max-width: min(260px, 100%);
  padding: 7px 10px;
  border: 1px solid var(--line-strong);
  border-radius: var(--r-sm);
  background: var(--pop);
  box-shadow: var(--shadow-2);
  font-size: var(--fs-sm);
  line-height: 1.35;
  pointer-events: none;
}

.chart-tip-title {
  margin-bottom: 2px;
  color: var(--ink-2);
  font-size: var(--fs-xs);
  overflow-wrap: anywhere;
}

.chart-tip-row {
  display: flex;
  align-items: center;
  gap: 6px;
  white-space: nowrap;
}

.chart-tip-key {
  flex-shrink: 0;
  width: 10px;
  height: 3px;
  border-radius: 2px;
}

.chart-tip-value {
  color: var(--ink);
  font-weight: 600;
}

.chart-tip-label {
  min-width: 0;
  overflow: hidden;
  color: var(--ink-2);
  text-overflow: ellipsis;
}

.chart-legend {
  display: flex;
  flex-wrap: wrap;
  gap: 4px 16px;
  color: var(--ink-2);
  font-size: var(--fs-sm);
  line-height: 1.4;
}

.chart-legend-item {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  min-width: 0;
}

.chart-swatch {
  flex-shrink: 0;
  width: 10px;
  height: 10px;
  border-radius: 3px;
}

.chart-swatch-line {
  width: 14px;
  height: 3px;
  border-radius: 2px;
}

.chart-legend-label {
  min-width: 0;
  overflow-wrap: anywhere;
}

.chart-legend-value {
  color: var(--ink);
  font-weight: 600;
}

.chart-details {
  font-size: var(--fs-sm);
}

.chart-details-summary {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  min-height: 36px;
  color: var(--accent-text);
  font-weight: 500;
  cursor: pointer;
  list-style: none;
  user-select: none;
}

.chart-details-summary::-webkit-details-marker {
  display: none;
}

.chart-details-summary::before {
  content: "";
  width: 6px;
  height: 6px;
  margin: 0 2px 0 3px;
  border-right: 1.75px solid currentColor;
  border-bottom: 1.75px solid currentColor;
  transform: rotate(-45deg);
  transition: transform var(--dur-1) var(--ease);
}

.chart-details[open] > .chart-details-summary::before {
  transform: rotate(45deg);
}

.chart-table {
  width: 100%;
  margin-top: var(--sp-1);
}

.chart-table th,
.chart-table td {
  padding: 6px 10px 6px 0;
  border-bottom: 1px solid var(--line);
  font-weight: 400;
  text-align: left;
  white-space: nowrap;
}

.chart-table thead th {
  color: var(--ink-3);
  font-size: var(--fs-xs);
  font-weight: 600;
}

.chart-table tbody th {
  white-space: normal;
  overflow-wrap: anywhere;
}

.chart-table .is-num {
  padding-right: 0;
  padding-left: 10px;
  text-align: right;
}

.chart-table tbody tr:last-child th,
.chart-table tbody tr:last-child td {
  border-bottom: 0;
}

.chart-empty {
  display: flex;
  align-items: center;
  padding: var(--sp-3) var(--sp-4);
  border: 1px dashed var(--line-strong);
  border-radius: var(--r-md);
  color: var(--ink-2);
  font-size: var(--fs-sm);
}

/* Barres horizontales classées. */
.hbar-list {
  display: flex;
  flex-direction: column;
  gap: var(--sp-3);
}

.hbar-item {
  min-width: 0;
  transition: opacity var(--dur-1) var(--ease);
}

.hbar-item.is-dim {
  opacity: 0.6;
}

.hbar-row {
  display: block;
  width: 100%;
  padding: 0;
  border: 0;
  background: none;
  color: inherit;
  font: inherit;
  text-align: left;
}

/* Ligne cliquable : au moins 44 px de haut pour le doigt, sans écarter davantage les lignes. */
.hbar-row-action {
  min-height: 44px;
  margin: -4px 0;
  padding: 4px 0;
  cursor: pointer;
  border-radius: var(--r-xs);
}

.hbar-row-action:hover .hbar-label {
  text-decoration: underline;
  text-decoration-thickness: 1px;
  text-underline-offset: 3px;
}

.hbar-head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: var(--sp-3);
}

.hbar-label {
  min-width: 0;
  overflow: hidden;
  font-size: 0.9375rem;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.hbar-value {
  flex-shrink: 0;
  font-size: 0.9375rem;
  font-weight: 600;
}

.hbar-share {
  display: inline-block;
  min-width: 3.1em;
  margin-left: 6px;
  color: var(--ink-3);
  font-size: var(--fs-sm);
  font-weight: 400;
  text-align: right;
}

.hbar-sub {
  display: block;
  color: var(--ink-2);
  font-size: var(--fs-sm);
}

.hbar-track {
  display: block;
  height: 8px;
  margin-top: 6px;
}

/* Bout arrondi côté valeur, carré côté départ. */
.hbar-fill {
  display: block;
  height: 100%;
  min-width: 2px;
  border-radius: 0 4px 4px 0;
}

/* Barre segmentée. */
.splitbar {
  display: flex;
  gap: 2px;
  width: 100%;
  min-width: 0;
}

.splitbar-seg {
  flex-basis: 0;
  flex-shrink: 1;
  min-width: 3px;
  overflow: hidden;
  transition: opacity var(--dur-1) var(--ease);
}

.splitbar-seg.is-dim {
  opacity: 0.55;
}

.splitbar-seg:focus-visible {
  outline-offset: 2px;
}

.splitbar-tall {
  height: 28px;
}

.splitbar-tall .splitbar-seg {
  border-radius: 4px;
}

.splitbar-text {
  display: block;
  padding-left: 7px;
  font-size: var(--fs-xs);
  font-weight: 600;
  line-height: 28px;
  white-space: nowrap;
}

.splitbar-thin {
  height: 8px;
}

.splitbar-thin .splitbar-seg:first-child {
  border-radius: var(--r-full) 0 0 var(--r-full);
}

.splitbar-thin .splitbar-seg:last-child {
  border-radius: 0 var(--r-full) var(--r-full) 0;
}

.splitbar-thin .splitbar-seg:only-child {
  border-radius: var(--r-full);
}

.splitbar-legend {
  flex-direction: column;
  gap: 6px;
}

.splitbar-legend .chart-legend-item {
  display: flex;
}

.splitbar-legend .chart-legend-label {
  flex: 1 1 auto;
}

.splitbar-legend .chart-legend-value {
  flex-shrink: 0;
}

@media (min-width: 640px) {
  .splitbar-legend {
    flex-direction: row;
    gap: 4px 20px;
  }

  .splitbar-legend .chart-legend-item {
    display: inline-flex;
  }

  .splitbar-legend .chart-legend-label {
    flex: 0 1 auto;
  }
}

/* Règles des écrans de la première version : journal, formulaire, associés, coquille. Couleurs : jetons uniquement. */

.shell-period {
  max-width: 11.5rem;
}

/* Ligne d'opération */
.oplist {
  display: flex;
  flex-direction: column;
}
.oplist-group + .oplist-group {
  border-top: 1px solid var(--line);
}
.oplist-month {
  margin: 0;
  padding: var(--sp-3) var(--sp-4) var(--sp-1);
  color: var(--ink-3);
}
.oplist > .btn {
  margin: var(--sp-3) var(--sp-4);
  width: auto;
}
.oplist-rows > * + * {
  border-top: 1px solid var(--line);
}
.oprow {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: var(--sp-3);
  width: 100%;
  padding: var(--sp-3) var(--sp-4);
  background: none;
  border: 0;
  color: var(--ink);
  font: inherit;
  text-align: left;
}
.oprow-button {
  cursor: pointer;
}
.oprow-button:hover {
  background: var(--surface-2);
}
.oprow-button:focus-visible {
  outline: 2px solid var(--focus);
  outline-offset: -2px;
}
.oprow-main {
  display: flex;
  flex-direction: column;
  gap: 2px;
  min-width: 0;
  flex: 1 1 auto;
}
.oprow-label {
  font-weight: 600;
  overflow-wrap: anywhere;
}
.oprow-detail {
  color: var(--ink-3);
  font-size: var(--fs-sm);
  overflow-wrap: anywhere;
}
.oprow-flags {
  display: flex;
  flex-wrap: wrap;
  gap: var(--sp-1);
  margin-top: var(--sp-1);
}
.oprow-amount {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  flex: 0 0 auto;
  font-weight: 600;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}
.oprow-base {
  color: var(--ink-3);
  font-size: var(--fs-xs);
  font-weight: 400;
}

.ops-totals {
  margin: 0;
}

.dash-equity {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  line-height: var(--lh-tight);
}

/* Formulaire d'opération */
.opform-sentence {
  margin: 0;
  padding: var(--sp-3);
  border-radius: var(--r-sm);
  background: var(--accent-soft);
  color: var(--ink);
  font-size: var(--fs-sm);
}
.opform-suggest {
  margin-top: var(--sp-2);
}
.opform-files {
  list-style: none;
  margin: 0;
  padding: 0;
  display: flex;
  flex-direction: column;
  gap: var(--sp-1);
}
.opform-files li {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--sp-2);
  min-width: 0;
  font-size: var(--fs-sm);
}
.opform-upload {
  display: inline-flex;
  align-items: center;
  min-height: var(--control-h);
  padding: 0 var(--sp-4);
  border: 1px dashed var(--control-line);
  border-radius: var(--r-sm);
  color: var(--accent-text);
  font-weight: 600;
  cursor: pointer;
  position: relative;
}
.opform-upload input {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  opacity: 0;
  cursor: pointer;
}
.opform-upload:focus-within {
  outline: 2px solid var(--focus);
  outline-offset: 2px;
}

/* Associés */
.share-lines {
  list-style: none;
  margin: 0;
  padding: 0;
  display: flex;
  flex-direction: column;
  gap: var(--sp-1);
}
.share-lines li {
  display: flex;
  justify-content: space-between;
  gap: var(--sp-3);
  font-variant-numeric: tabular-nums;
}
.partner-detail {
  border: 1px solid var(--line);
  border-radius: var(--r-md);
  background: var(--surface);
}
.partner-detail > summary {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--sp-3);
  min-height: var(--control-h);
  padding: var(--sp-2) var(--sp-4);
  cursor: pointer;
}
.partner-detail > summary:focus-visible {
  outline: 2px solid var(--focus);
  outline-offset: 2px;
  border-radius: var(--r-md);
}
.partner-breakdown {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: var(--sp-1) var(--sp-4);
  margin: 0;
  padding: var(--sp-2) var(--sp-4) var(--sp-4);
  font-size: var(--fs-sm);
}
.partner-breakdown dt {
  color: var(--ink-2);
}
.partner-breakdown dd {
  margin: 0;
  text-align: right;
  font-variant-numeric: tabular-nums;
}
.partner-breakdown .strong {
  color: var(--ink);
  font-weight: 700;
  padding-top: var(--sp-1);
  border-top: 1px solid var(--line);
}
.partner-entries {
  width: 100%;
  border-collapse: collapse;
  font-size: var(--fs-sm);
}
.partner-entries th,
.partner-entries td {
  padding: var(--sp-2) var(--sp-4);
  border-top: 1px solid var(--line);
  text-align: left;
  vertical-align: top;
}
.partner-entries th {
  color: var(--ink-3);
  font-weight: 600;
}
.partner-entries .num {
  text-align: right;
  white-space: nowrap;
}
