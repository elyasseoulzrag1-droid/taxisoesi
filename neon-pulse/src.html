<meta charset="utf-8">
<title>Neon Pulse</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&display=swap">
<style>
/* Layout : un seul canvas plein écran, tout le jeu est dessiné dedans. Look unique, sombre et néon. */
:root{
  --bg:#05030f; --fg:#eaf7ff; --neon:#22e6ff; --hot:#ff2bd6;
  --display:"Chakra Petch","Trebuchet MS",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);overflow:hidden;font-family:var(--display)}
body{padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px));box-sizing:border-box}
canvas{display:block;width:100%;height:100%;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;outline:none}
</style>
<canvas id="c" tabindex="0" aria-label="Neon Pulse, jeu de rythme. Touche l'écran ou appuie sur Espace pour jouer."></canvas>
<!--TRACKS-->
<script>
(()=>{
const cv=document.getElementById('c'),g=cv.getContext('2d');
const H=540;let W=960,SC=1,OY=0,ROT=false,DPR=1;
const TOUCH=matchMedia('(pointer:coarse)').matches,TAP=TOUCH?'Touche l’écran':'ESPACE ou clic';
function resize(){const d=DPR=Math.min(devicePixelRatio||1,2),w=cv.clientWidth||innerWidth,h=cv.clientHeight||innerHeight;
  cv.width=w*d;cv.height=h*d;ROT=h>w*1.15;const vw=ROT?cv.height:cv.width,vh=ROT?cv.width:cv.height;SC=Math.min(vh/H,vw/760);W=vw/SC;OY=(vh/SC-H)/2}
addEventListener('resize',resize);resize();

/* ---------- niveaux ---------- */
const V=520,GY=440,CY=100,R=23,HR=16,PADV=1300;
const LEVELS=[
 {name:'NIVEAU 1',sub:'Deep house',file:'track.mp3',bpm:126.045,lead:.23,end:106,shape:0,
  sec:[{b:0,mode:'jump',v:1,name:'',hue:190},{b:28,mode:'ship',v:1,name:'VOL',hue:275},
       {b:52,mode:'grav',v:1,name:'GRAVITÉ',hue:135},{b:76,mode:'turbo',v:1.45,name:'TURBO',hue:345}],
  build(S,B,L){
   [[6,1],[8,1],[10,2],[12,1],[13,1],[14,2],[16,1],[17,1],[18,1],[20,3],[22,1],[23,1],[24,2],[26,1]].forEach(a=>S(a[0],a[1]));
   B(31,150,1);B(33,150,-1);B(35,180,1);B(36.5,160,-1);L(38,190,1);L(39.5,190,-1);
   B(41,110,1);B(41,80,-1);B(43,200,-1);B(44.5,200,1);L(46,170,-1);L(47.5,170,1);L(49,190,-1);
   [[55,3,1],[57,3,-1],[59,3,1],[60.5,3,-1],[62,4,1],[64,2,-1],[65,2,1],[66,2,-1],[67,2,1],[69,3,-1],[71,3,1],[72.5,3,-1],[74,2,1]].forEach(a=>S(a[0],a[1],a[2]));
   [[79,1],[80,1],[81,2],[83,1],[84,1],[85,1],[86,2],[88,3],[90,1],[91,1],[92,2],[93,1],[94,1],[96,3],[98,1],[99,1],[100,2],[101,1],[102,3]].forEach(a=>S(a[0],a[1]));
  }},
 {name:'NIVEAU 2',sub:'Deep house solaire',file:'sunset-126.mp3',bpm:125.824,lead:.188,tm:[[12,0],[28,.008],[44,.022],[60,.046],[76,.06],[92,.06],[108,.048],[120,.036]],end:125,shape:6,
  sec:[{b:0,mode:'jump',v:1,name:'',hue:28},{b:28,mode:'wave',v:1,name:'ZIGZAG',hue:330},
       {b:52,mode:'grav',v:1.2,name:'GRAVITÉ +',hue:45},{b:76,mode:'ship',v:1.1,name:'SCIES',hue:175},{b:100,mode:'turbo',v:1.5,name:'HYPER',hue:15}],
  build(S,B,L,SW){
   [[6,1],[7,1],[8,2],[10.5,5],[13,1],[14,1],[15,2],[17,5],[19.5,1],[20.5,1],[21.5,2],[23.5,5],[26,2]].forEach(a=>S(a[0],a[1]));
   [270,190,330,230,350,180,300,200,340,250,170,310,220,270].forEach((c,i)=>{const b=30.5+i*1.5;B(b,c-80-CY,-1,50);B(b,GY-c-80,1,50)});
   [[55,3,1],[56.5,3,-1],[58,3,1],[59,2,-1],[60,2,1],[61,2,-1],[62.5,4,1],[64,3,-1],[65,2,1],[66,2,-1],[67,2,1],[68,2,-1],[69.5,4,1],[71,3,-1],[72,2,1],[73,2,-1],[74.5,3,1]].forEach(a=>S(a[0],a[1],a[2]));
   SW(79,0);SW(81,3.14);B(83,150,1);SW(85,1.57);SW(86.5,4.71);B(88,140,-1);L(89.5,170,1);SW(91,0);SW(92.5,3.14);B(94,120,1);B(94,90,-1);SW(96,1.57);SW(97.5,4.71);
   [[103,1],[104,1],[105,2],[107,6],[109,1],[110,1],[111,2],[112,1],[114,6],[116,1],[117,2],[118,1],[119,1],[121,6],[123,2]].forEach(a=>S(a[0],a[1]));
  }}
];
let LI=0,LVL,BT,PB,END,SEC,OB,GR,cum;
const bx=b=>{let i=SEC.length-1;while(i>0&&b<SEC[i].b)i--;return cum[i]+(b-SEC[i].b)*PB*SEC[i].v};
const secOf=b=>{let i=SEC.length-1;while(i>0&&b<SEC[i].b)i--;return SEC[i]};
function loadLevel(i){
  LI=i;LVL=LEVELS[i];BT=60/LVL.bpm;PB=V*BT;END=LVL.end;SEC=LVL.sec;OB=[];GR=[];cum=[0];
  for(let k=1;k<SEC.length;k++)cum[k]=cum[k-1]+(SEC[k].b-SEC[k-1].b)*PB*SEC[k-1].v;
  const S=(b,n=1,side=1)=>{const c=bx(b),pad=n>=5;GR.push({c,hw:n*20,side,b,pad});
    for(let j=0;j<n;j++)OB.push({k:'s',x:c+(j-(n-1)/2)*40,side});
    if(pad)OB.push({k:'p',x:c-PADV/4308*V*secOf(b).v})};
  const B=(b,h,side,w=70)=>OB.push({k:'b',x:bx(b)-w/2,w,h,side,c:bx(b)});
  const L=(b,h,side)=>OB.push({k:'l',x:bx(b)-5,w:10,h,side,c:bx(b)});
  const SW=(b,ph)=>OB.push({k:'w',x:bx(b),c:bx(b),r:38,ph,b});
  LVL.build(S,B,L,SW);OB.sort((a,b)=>a.x-b.x);GR.sort((a,b)=>a.c-b.c);
}
// carte de tempo : petit décalage (en secondes) selon le temps musical, pour suivre un morceau dont le tempo flotte
const off=L=>{const m=LVL.tm;if(!m)return 0;if(L<=m[0][0])return m[0][1];for(let i=1;i<m.length;i++)if(L<=m[i][0]){const a=m[i-1],b=m[i];return a[1]+(b[1]-a[1])*(L-a[0])/(b[0]-a[0])}return m[m.length-1][1]};
const timeOf=L=>LVL.lead+L*BT+off(L);
const beatAt=ts=>{let L=(ts-LVL.lead)/BT;for(let i=0;i<3;i++)L=(ts-LVL.lead-off(L))/BT;return L};
const sawY=(o,bt)=>270+95*Math.sin(bt*Math.PI/4+o.ph);
loadLevel(0);

/* ---------- audio ---------- */
let ac,comp,master,duck,dly,noiseBuf,src=null,musicReady=false;const trackBufs=[];
const mf=m=>440*Math.pow(2,(m-69)/12);
const CH=[{r:33,n:[60,64,67,71]},{r:29,n:[57,60,64,67]},{r:26,n:[53,57,60,64]},{r:28,n:[55,59,62,66]}];
function initAudio(){
  ac=new (window.AudioContext||window.webkitAudioContext)();
  comp=ac.createDynamicsCompressor();comp.connect(ac.destination);
  const n=ac.sampleRate;noiseBuf=ac.createBuffer(1,n,n);const d=noiseBuf.getChannelData(0);for(let i=0;i<n;i++)d[i]=Math.random()*2-1;
}
function newBus(){
  if(master){const m=master;m.gain.cancelScheduledValues(ac.currentTime);m.gain.setTargetAtTime(0,ac.currentTime,.03);setTimeout(()=>m.disconnect(),500)}
  if(src){try{src.stop(ac.currentTime+.2)}catch(e){}src=null}
  master=ac.createGain();master.gain.value=.85;master.connect(comp);
  duck=ac.createGain();duck.connect(master);
  dly=ac.createDelay(1);dly.delayTime.value=BT*.75;const fb=ac.createGain();fb.gain.value=.36;dly.connect(fb);fb.connect(dly);dly.connect(duck);
}
function kick(t){const o=ac.createOscillator(),a=ac.createGain();o.frequency.setValueAtTime(155,t);o.frequency.exponentialRampToValueAtTime(42,t+.12);
  a.gain.setValueAtTime(1,t);a.gain.exponentialRampToValueAtTime(.001,t+.33);o.connect(a);a.connect(master);o.start(t);o.stop(t+.36);
  duck.gain.setValueAtTime(.28,t);duck.gain.linearRampToValueAtTime(1,t+BT*.62)}
function noise(t,type,f,q,peak,dec,dest){const s=ac.createBufferSource();s.buffer=noiseBuf;s.loop=true;const fl=ac.createBiquadFilter();fl.type=type;fl.frequency.value=f;fl.Q.value=q;
  const a=ac.createGain();a.gain.setValueAtTime(peak,t);a.gain.exponentialRampToValueAtTime(.001,t+dec);s.connect(fl);fl.connect(a);a.connect(dest||master);s.start(t,Math.random());s.stop(t+dec+.02)}
function tone(t,type,f,dur,peak,cut,dest,send){const o=ac.createOscillator(),o2=ac.createOscillator(),fl=ac.createBiquadFilter(),a=ac.createGain();
  o.type=o2.type=type;o.frequency.value=f;o2.frequency.value=f*1.006;fl.type='lowpass';fl.Q.value=4;
  fl.frequency.setValueAtTime(cut*2.2,t);fl.frequency.exponentialRampToValueAtTime(cut,t+dur);
  a.gain.setValueAtTime(.0001,t);a.gain.linearRampToValueAtTime(peak,t+.008);a.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(fl);o2.connect(fl);fl.connect(a);a.connect(dest);if(send)a.connect(dly);o.start(t);o2.start(t);o.stop(t+dur+.02);o2.stop(t+dur+.02)}
function schedStep(s,t){ // synthé de secours si le morceau ne se charge pas
  const beat=s/4,st=s%16,q=s%4,ch=CH[Math.floor(s/16)%4];
  if(beat>=END+3)return;
  if(q===0&&beat>=4)kick(t);
  if(q===2)noise(t,'highpass',7500,1,.22,.06);
  if(beat>=12&&(st===4||st===12))noise(t,'bandpass',1600,1.2,.5,.16);
  if(beat>=4){if(q===2)tone(t,'sawtooth',mf(ch.r),BT*.45,.42,260,duck);if(st===15)tone(t,'sawtooth',mf(ch.r+12),BT*.22,.3,400,duck)}
  if(beat<4&&st===0)ch.n.forEach(n=>tone(t,'sawtooth',mf(n),BT*3.8,.05,500,duck,true));
  if(beat>=12&&(st===3||st===6||st===11||st===14))ch.n.forEach(n=>tone(t,'sawtooth',mf(n),BT*.45,.06,1100,duck,true));
  if(beat>=52&&q%2===0)tone(t,'triangle',mf(ch.n[(s/2)%4]+12),BT*.3,.08,2600,duck,true);
}
function boom(){const t=ac.currentTime;noise(t,'lowpass',900,1,.7,.45,comp);
  const o=ac.createOscillator(),a=ac.createGain();o.type='sawtooth';o.frequency.setValueAtTime(220,t);o.frequency.exponentialRampToValueAtTime(30,t+.4);
  a.gain.setValueAtTime(.4,t);a.gain.exponentialRampToValueAtTime(.001,t+.45);o.connect(a);a.connect(comp);o.start(t);o.stop(t+.5)}
function chime(){const t=ac.currentTime;[72,76,79,84,88].forEach((n,i)=>tone(t+i*.09,'triangle',mf(n),.7,.14,4000,comp))}
function boing(){const t=ac.currentTime;const o=ac.createOscillator(),a=ac.createGain();o.type='square';o.frequency.setValueAtTime(300,t);o.frequency.exponentialRampToValueAtTime(1200,t+.12);
  a.gain.setValueAtTime(.12,t);a.gain.exponentialRampToValueAtTime(.001,t+.16);o.connect(a);a.connect(comp);o.start(t);o.stop(t+.18)}

/* ---------- état ---------- */
let st='menu',t0=0,startBeat=0,nextStep=0,beat=0,lastA=0,secI=0,mode='jump',hue=190,cp=0;
let p={y:GY-R,vy:0,gd:1,on:true,rot:0},px=0,down=false,pressT=-9,attempts=1,deadAt=0,winAt=0,shake=0,flash=0,ban={txt:'',t:9};
let parts=[],trail=[],rings=[],bot=/bot/.test(location.search);
const stars=Array.from({length:70},()=>({x:Math.random()*3000,y:Math.random()*H,z:.2+Math.random()*.8}));
const now=()=>performance.now()/1000;
function start(from){
  if(!ac)initAudio();ac.resume();newBus();
  startBeat=from;t0=ac.currentTime+.15;
  if(trackBufs[LI]){src=ac.createBufferSource();src.buffer=trackBufs[LI];src.connect(master);src.start(t0,timeOf(from))}
  nextStep=Math.ceil(from*4);lastA=ac.currentTime;beat=from;
  secI=0;for(let i=0;i<SEC.length;i++)if(from>=SEC[i].b)secI=i;mode=SEC[secI].mode;
  p={y:GY-R,vy:0,gd:1,on:true,rot:0};px=bx(from);trail=[];parts=[];rings=[];st='play';flash=.3;
}
function play(i){loadLevel(i);attempts=1;cp=0;start(0)}
function die(){st='dead';deadAt=now();shake=1;flash=.8;boom();
  master.gain.cancelScheduledValues(ac.currentTime);master.gain.setTargetAtTime(0,ac.currentTime,.04);
  burst(px,p.y,80,hue,560);rings.push({x:px,y:p.y,r:10,life:.6,max:.6,hue});rings.push({x:px,y:p.y,r:4,life:.9,max:.9,hue:hue+160})}
function win(){st='win';winAt=now();flash=1;chime();master.gain.setTargetAtTime(0,ac.currentTime+2.5,1.2);ban={txt:'',t:9}}
function burst(x,y,n,h,sp){for(let i=0;i<n;i++){const a=Math.random()*6.283,v=sp*(.2+Math.random());
  parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:.4+Math.random()*.7,max:1.1,hue:h+Math.random()*80-40,s:2+Math.random()*4,gr:500})}}
let silentEl=null,pending=null;
function unlock(){ // iOS : le son ne démarre que dans un geste terminé, et le mode silencieux coupe WebAudio sans ceci
  try{if(navigator.audioSession)navigator.audioSession.type='playback'}catch(e){}
  try{if(!silentEl){const n=4410,b=new ArrayBuffer(44+n*2),v=new DataView(b),w=(o,t)=>[...t].forEach((c,i)=>v.setUint8(o+i,c.charCodeAt(0)));
      w(0,'RIFF');v.setUint32(4,36+n*2,true);w(8,'WAVEfmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);v.setUint32(24,44100,true);v.setUint32(28,88200,true);v.setUint16(32,2,true);v.setUint16(34,16,true);w(36,'data');v.setUint32(40,n*2,true);
      silentEl=new Audio(URL.createObjectURL(new Blob([b],{type:'audio/wav'})));silentEl.loop=true;silentEl.setAttribute('playsinline','')}
    if(silentEl.paused){const pr=silentEl.play();if(pr)pr.catch(()=>{})}}catch(e){}
  try{if(ac&&ac.state!=='running'&&!document.hidden)ac.resume()}catch(e){}
}
function act(pt){unlock();
  if(st==='menu'){if(musicReady){const l=pt?(pt.x<W/2?0:1):LI;if(trackBufs[l])play(l);else{musicReady=false;ensureTrack(l).then(()=>{musicReady=true;play(l)})}}}
  else if(st==='dead'){if(pt&&pt.x<150&&pt.y<70-OY*.6+20){st='menu';return}if(now()-deadAt>.35){attempts++;start(cp)}}
  else if(st==='win'&&now()-winAt>1.2){if(LI+1<LEVELS.length)play(LI+1);else{st='menu';loadLevel(0)}}}
function press(pt){down=true;pressT=now();if(st==='play')return;if(pt)pending=pt;else act(null)}
function release(){down=false;unlock();if(pending){const q=pending;pending=null;act(q)}}
const KEYS=['Space','ArrowUp','KeyW','KeyX','Enter'];
addEventListener('keydown',e=>{if(KEYS.includes(e.code)){e.preventDefault();if(!e.repeat)press(null)}
  if(e.code==='KeyR'&&st!=='menu'){attempts++;cp=0;start(0)}
  if(e.code==='Escape'&&st!=='menu'){if(master)master.gain.setTargetAtTime(0,ac.currentTime,.04);st='menu'}
  if((e.code==='Digit1'||e.code==='Digit2')&&st==='menu'&&musicReady){unlock();const l=e.code==='Digit1'?0:1;ensureTrack(l).then(()=>play(l))}
  if(e.code==='KeyB')bot=!bot});
addEventListener('keyup',e=>{if(KEYS.includes(e.code))down=false});
cv.addEventListener('pointerdown',e=>{e.preventDefault();cv.focus();const r=cv.getBoundingClientRect(),cx=(e.clientX-r.left)*DPR,cy=(e.clientY-r.top)*DPR;
  press(ROT?{x:cy/SC,y:(cv.width-cx)/SC-OY}:{x:cx/SC,y:cy/SC-OY})});
addEventListener('pointerup',release);addEventListener('pointercancel',()=>{down=false;pending=null});
['touchstart','touchmove','touchend','gesturestart','contextmenu','dblclick'].forEach(n=>cv.addEventListener(n,e=>e.preventDefault(),{passive:false}));
addEventListener('touchend',unlock);addEventListener('click',unlock);
document.addEventListener('visibilitychange',()=>{if(!ac)return;if(document.hidden)ac.suspend();else if(st==='play')ac.resume()});

/* ---------- bot (touche B) ---------- */
function botThink(){
  const sp=V*SEC[secI].v;
  if(mode==='jump'||mode==='turbo'){const Lj=sp*.42;down=false;for(const q of GR){if(q.side!==1||q.pad)continue;if(px>=q.c-Lj/2-6&&px<q.c){down=true;break}}}
  else if(mode==='ship'||mode==='wave'){let top=CY,bot2=GY,found=null;
    for(const o of OB){if(o.k==='s'||o.k==='p')continue;const ow=o.k==='w'?o.r:o.w,ox=o.k==='w'?o.c-o.r:o.x;if(ox+ow+(o.k==='w'?o.r:0)<px-28)continue;if(found===null){if(o.c-px>330)break;found=o.c}
      if(Math.abs(o.c-found)<60){
        if(o.k==='w'){const y=sawY(o,beat+Math.max(0,o.c-px)/(PB*SEC[secI].v));if(y>270)bot2=Math.min(bot2,y-o.r);else top=Math.max(top,y+o.r)}
        else if(o.side===1)bot2=Math.min(bot2,GY-o.h);else top=Math.max(top,CY+o.h)}}
    const tg=(top+bot2)/2;down=mode==='wave'?p.y>tg:p.y+p.vy*.09>tg}
  else{for(const q of GR){if(secOf(q.b).mode!=='grav')continue;if(q.c+q.hw+26<px)continue;
      if(q.side===p.gd&&p.on&&q.c-q.hw-px<235*SEC[secI].v)pressT=now();break}}
}

/* ---------- simulation ---------- */
function hitRect(cx,cy,r,x,y,w,h){const nx=Math.max(x,Math.min(cx,x+w)),ny=Math.max(y,Math.min(cy,y+h));return (cx-nx)**2+(cy-ny)**2<r*r}
function collide(){
  for(const o of OB){if(o.x<px-140)continue;if(o.x>px+140)break;
    if(o.k==='s'){if(hitRect(px,p.y,HR,o.x-8,o.side===1?GY-27:CY,16,27))return true}
    else if(o.k==='p'){if(p.on&&p.gd===1&&(mode==='jump'||mode==='turbo')&&Math.abs(px-o.x)<30){p.vy=-PADV;p.on=false;boing();burst(o.x,GY,18,50,300);rings.push({x:o.x,y:GY,r:8,life:.4,max:.4,hue:50})}}
    else if(o.k==='w'){const y=sawY(o,beat);if((px-o.c)**2+(p.y-y)**2<(o.r+HR-3)**2)return true}
    else if(hitRect(px,p.y,HR+1,o.x,o.side===1?GY-o.h:CY,o.w,o.h))return true}
  return false}
function step(dt){
  if(mode==='jump'||mode==='turbo'){
    if(p.on&&down){p.vy=-905;p.on=false;puff(1)}
    p.vy+=4308*dt;p.y+=p.vy*dt;if(p.y>=GY-R){p.y=GY-R;p.vy=0;p.on=true}
  }else if(mode==='ship'){
    p.vy+=(down?-2600:2200)*dt;p.vy=Math.max(-430,Math.min(430,p.vy));p.y+=p.vy*dt;
    if(p.y>GY-R){p.y=GY-R;p.vy=0}if(p.y<CY+R){p.y=CY+R;p.vy=0}
  }else if(mode==='wave'){
    p.vy=(down?-1:1)*V*.9;p.y+=p.vy*dt;if(p.y>GY-R)p.y=GY-R;if(p.y<CY+R)p.y=CY+R;
  }else{
    if(p.on&&now()-pressT<.12){p.gd*=-1;p.vy=p.gd*500;p.on=false;pressT=-9;puff(-p.gd);rings.push({x:px,y:p.y,r:6,life:.3,max:.3,hue})}
    p.vy+=5200*p.gd*dt;p.y+=p.vy*dt;
    if(p.gd>0&&p.y>=GY-R){p.y=GY-R;p.vy=0;p.on=true}
    if(p.gd<0&&p.y<=CY+R){p.y=CY+R;p.vy=0;p.on=true}
  }
}
function puff(side){for(let i=0;i<6;i++)parts.push({x:px-6,y:p.y+side*R,vx:-120-Math.random()*160,vy:-side*Math.random()*120,life:.3,max:.3,hue,s:3,gr:0})}
function update(){
  const a=ac.currentTime;
  while(!trackBufs[LI]&&t0+(nextStep/4-startBeat)*BT<a+.2){schedStep(nextStep,Math.max(a,t0+(nextStep/4-startBeat)*BT));nextStep++}
  let dt=Math.min(a-lastA,.05);lastA=a;if(dt<=0)return;
  if(a<t0)return;const b1=trackBufs[LI]?beatAt(timeOf(startBeat)+(a-t0)):startBeat+(a-t0)/BT;
  const b0=beat,n=Math.max(1,Math.ceil(dt/.004));
  for(let i=1;i<=n;i++){

}

const hsl=(h,s,l,a=1)=>`hsla(${((h%360)+360)%360},${s}%,${l}%,${a})`;

    const bw=Math.min(420,W*.45),pr=Math.min(1,beat/END);g.fillStyle='rgba(255,255,255,.12)';g.fillRect(W/2-bw/2,hy-3,bw,6);
    g.fillStyle=hsl(hue,100,65);g.fillRect(W/2-bw/2,hy-3,bw*pr,6);

// musique Suno : les morceaux sont embarqués dans la page (aucun téléchargement), décodés au chargement puis de nouveau au premier toucher si besoin
const RAW=[];let musicErr='';
function bytesOf(i){if(RAW[i])return Promise.resolve(RAW[i]);const d=(window.NP_TRACKS||[])[i];
  if(d){const bin=atob(d),u=new Uint8Array(bin.length);for(let k=0;k<bin.length;k++)u[k]=bin.charCodeAt(k);RAW[i]=u.buffer;return Promise.resolve(RAW[i])}
  return fetch(LEVELS[i].file).then(r=>{if(!r.ok)throw new Error('http '+r.status);return r.arrayBuffer()}).then(b=>RAW[i]=b)}
function ensureTrack(i){if(trackBufs[i])return Promise.resolve(true);
  return bytesOf(i).then(b=>new Promise((res,rej)=>{const pr=ac.decodeAudioData(b.slice(0),res,rej);if(pr&&pr.catch)pr.catch(rej)}))
    .then(buf=>{trackBufs[i]=buf;return true}).catch(e=>{musicErr=String(e&&e.message||e||'erreur').slice(0,40);return false})}
try{initAudio();const to=setTimeout(()=>musicReady=true,12000);
  Promise.all(LEVELS.map((l,i)=>ensureTrack(i))).finally(()=>{clearTimeout(to);musicReady=true})
}catch(e){musicErr='audio indisponible';musicReady=true}
let lt=now();
function frame(){const t=now(),dt=Math.min(.05,t-lt);lt=t;if(st==='play')update();draw(dt);requestAnimationFrame(frame)}
window.__np={get s(){return{st,beat,attempts,mode,cp,lvl:LI,tracks:trackBufs.map(b=>!!b)}},setBot:v=>bot=v,play};
requestAnimationFrame(frame);
})();
